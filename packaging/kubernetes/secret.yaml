# TEMPLATE — replace every value below before applying, then never commit
# the filled-in version. Prefer `kubectl create secret generic nexusflow-secrets
# --from-literal=... ` or a real secrets manager (Sealed Secrets, External
# Secrets Operator, Vault) over editing this file in place — see
# packaging/kubernetes/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: nexusflow-secrets
  labels:
    app.kubernetes.io/name: nexusflow
type: Opaque
stringData:
  # openssl rand -hex 32 (each) — no default on purpose, the process
  # refuses to boot without both (ARCHITECTURE.md §10).
  NEXUS_JWT_SECRET: "REPLACE_ME"
  NEXUS_ENCRYPTION_KEY: "REPLACE_ME_64_HEX_CHARS"
  # First-boot admin password, paired with NEXUS_ADMIN_USERNAME (ConfigMap).
  NEXUS_ADMIN_PASSWORD: "REPLACE_ME"
  # Same Postgres for all three (tables don't collide) or separate DBs —
  # see GETTING_STARTED.md §3 "Metadados em Postgres (multi-réplica / k8s)".
  # Required for >1 replica: SQLite (the default) cannot be shared safely
  # across pods.
  NEXUS_CHECKPOINT_DB: "postgres://user:REPLACE_ME@postgres:5432/nexusflow"
  NEXUS_AUTH_DB: "postgres://user:REPLACE_ME@postgres:5432/nexusflow"
  NEXUS_PIPELINES_DB: "postgres://user:REPLACE_ME@postgres:5432/nexusflow"
  NEXUS_EMAIL_SMTP_PASSWORD: ""
  NEXUS_SLACK_WEBHOOK_URL: ""
  NEXUS_TEAMS_WEBHOOK_URL: ""
  NEXUS_PAGERDUTY_ROUTING_KEY: ""
  NEXUS_ALERT_WEBHOOK_URL: ""
