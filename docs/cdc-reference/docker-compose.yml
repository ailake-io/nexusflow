# Ambiente de referência pra CDC (Marco 4) — Postgres -> Debezium -> Kafka.
#
# NÃO é infra de produção. É só o stack mínimo pra testar/exemplificar o modo
# "Debezium envelope" do nexus-connector-kafka localmente. Ver
# ARCHITECTURE.md §7 (CDC — escopo faseado) e IMPLEMENTATION_PLAN.md Marco 4.
#
# Uso:
#   docker compose -f docs/cdc-reference/docker-compose.yml up -d
#   curl -X POST -H "Content-Type: application/json" \
#     --data @docs/cdc-reference/register-postgres-connector.json \
#     http://localhost:8083/connectors
#
# Ver docs/cdc-reference/README.md pro passo a passo completo.
services:
  zookeeper:
    image: quay.io/debezium/zookeeper:2.7
    ports:
      - "2181:2181"
    environment:
      # Uncapped JVM heap ergonomics off the host's total RAM (not a cgroup
      # limit) — three uncapped JVMs (zookeeper+kafka+connect) is a lot on a
      # dev laptop. Bump these if you hit OOM with a heavier workload.
      KAFKA_HEAP_OPTS: "-Xmx192M -Xms128M"

  kafka:
    image: quay.io/debezium/kafka:2.7
    # Dual listener: INTERNAL is what other containers (connect) use to
    # reach the broker via its network alias; EXTERNAL is what a client on
    # the host machine (e.g. nexus-connector-kafka run locally) uses via
    # localhost. A single "kafka:9092" listener only resolves inside this
    # compose network, not from the host.
    ports:
      - "9093:9093"
    environment:
      ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms128M"
    depends_on:
      - zookeeper

  postgres:
    image: quay.io/debezium/postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus

  connect:
    image: quay.io/debezium/connect:2.7
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: nexus-cdc-reference
      CONFIG_STORAGE_TOPIC: nexus_connect_configs
      OFFSET_STORAGE_TOPIC: nexus_connect_offsets
      STATUS_STORAGE_TOPIC: nexus_connect_statuses
      KAFKA_HEAP_OPTS: "-Xmx384M -Xms256M"
    depends_on:
      - kafka
      - postgres
