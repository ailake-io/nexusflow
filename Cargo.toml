[workspace]
resolver = "2"
members = [
    "crates/nexus-core",
    "crates/nexus-ai",
    "crates/nexus-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[package]
name = "nexusflow"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
nexus-server = { path = "crates/nexus-server" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
