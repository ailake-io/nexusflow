[workspace]
resolver = "2"
members = [
    "crates/nexus-core",
    "crates/nexus-ai",
    "crates/nexus-server",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"

[package]
name = "nexusflow"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Forwards to nexus-server's own "dbt" feature (Marco 10, CLAUDE.md §4.4) —
# the root binary has no code of its own to gate, just needs the flag to
# reach the crate that does.
dbt = ["nexus-server/dbt"]
# Forwards to nexus-server's "embed-ui" feature (Marco 11, CLAUDE.md §7) —
# single-binary deploy: `npm run build` in frontend/ then
# `cargo build --release -p nexusflow --features embed-ui`.
embed-ui = ["nexus-server/embed-ui"]
# Embedding pipeline stage (local ONNX model).
embeddings = ["nexus-server/embeddings"]
# Embedding pipeline stage backed by an external HTTP API.
embeddings-api = ["nexus-server/embeddings-api"]
# Forwards nexus-server's per-connector features (see that crate's own
# Cargo.toml for why each one exists) so `cargo build -p nexusflow
# --features X` reaches the crate that actually declares X.
connectors-all = ["nexus-server/connectors-all"]
mongodb = ["nexus-server/mongodb"]
kafka = ["nexus-server/kafka"]
rest = ["nexus-server/rest"]
odbc = ["nexus-server/odbc"]
milvus = ["nexus-server/milvus"]
qdrant = ["nexus-server/qdrant"]
lancedb = ["nexus-server/lancedb"]
pgvector = ["nexus-server/pgvector"]
pinecone = ["nexus-server/pinecone"]
chromadb = ["nexus-server/chromadb"]
deltalake = ["nexus-server/deltalake"]
iceberg = ["nexus-server/iceberg"]
parquet = ["nexus-server/parquet"]
ailake = ["nexus-server/ailake"]
csv = ["nexus-server/csv"]
# Native CDC features (logical/binlog/change-data-feed) — forward to the
# server crate's matching feature (ARCHITECTURE.md §7).
postgres-cdc = ["nexus-server/postgres-cdc"]
mysql-cdc = ["nexus-server/mysql-cdc"]
deltalake-cdc = ["nexus-server/deltalake-cdc"]
iceberg-cdc = ["nexus-server/iceberg-cdc"]
ailake-cdc = ["nexus-server/ailake-cdc"]

[dependencies]
anyhow = "1.0.104"
nexus-server = { path = "crates/nexus-server" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
