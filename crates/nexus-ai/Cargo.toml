[package]
name = "nexus-ai"
version.workspace = true
edition.workspace = true
license.workspace = true

# `cpu` gates every ONNX/model-download dependency (CLAUDE.md §8.5) — the
# default build of this crate has zero dependencies beyond `chunking`'s pure
# functions. `cuda`/`metal`/`api` accelerations land as separate features on
# top of `cpu` once the inference wrapper itself is implemented.
[features]
default = []
cpu = [
    "dep:hf-hub",
    "dep:dirs",
    "dep:tokio",
    "dep:thiserror",
    "dep:ort",
    "dep:tokenizers",
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:ndarray",
]
# NVIDIA GPU inference via ONNX Runtime's CUDA execution provider. Requires
# a CUDA-enabled ONNX Runtime build at link time (see Dockerfile's `cuda`
# runtime profile, CLAUDE.md §7) — not validated on real hardware in this
# sandbox (Linux, no GPU), only that the feature compiles and the EP is
# registered before session load.
cuda = ["cpu", "ort/cuda"]
# Apple Silicon/Metal inference via ONNX Runtime's CoreML execution
# provider (ONNX Runtime has no execution provider named "Metal" directly —
# CoreML is the EP that dispatches to the Neural Engine/GPU on Apple
# hardware). Not validated on real hardware in this sandbox (Linux).
metal = ["cpu", "ort/coreml"]
# Embeddings via an external HTTP API (OpenAI-compatible `/embeddings`
# endpoint) instead of a local ONNX model — no `ort`/`tokenizers`/`hf-hub`
# needed, deliberately independent of `cpu` (CLAUDE.md §8.5: don't pull in
# heavy local-inference deps just to call a remote API).
api = [
    "dep:reqwest",
    "dep:tokio",
    "dep:thiserror",
    "dep:serde",
    "dep:serde_json",
    "dep:arrow-array",
    "dep:arrow-schema",
]

[dependencies]
arrow-array = { version = "58.4.0", optional = true }
arrow-schema = { version = "58.4.0", optional = true }
nexus-core = { version = "0.1.0", path = "../nexus-core" }
dirs = { version = "5.0.1", optional = true }
hf-hub = { version = "0.4.3", optional = true, default-features = false, features = [
    "tokio",
    "rustls-tls",
] }
# Not used directly — declared so Cargo's feature unification turns on
# ndarray's `std` feature for the copy `ort`'s own `ndarray` feature pulls in
# transitively (ort needs `NdFloat`, which is gated behind `std`).
ndarray = { version = "0.17", optional = true, features = ["std"] }
ort = { version = "2.0.0-rc.10", optional = true, default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "tls-rustls",
    # CI compiles cuda+metal together via --all-features on a plain Linux
    # runner with neither GPU nor Apple hardware — no prebuilt ort-sys binary
    # satisfies that exact combo. This makes ort-sys fall back to the closest
    # available build instead of refusing to link; the EPs still aren't
    # exercised on real hardware here regardless (see the `cuda`/`metal`
    # feature doc comments above).
    "lax-feature-matching",
] }
reqwest = { version = "0.12.28", optional = true, default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1.0.229", optional = true, features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
thiserror = { version = "2.0.19", optional = true }
tokenizers = { version = "0.21.4", optional = true, default-features = false, features = [
    "onig",
] }
tokio = { version = "1.53.1", features = ["rt"], optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
