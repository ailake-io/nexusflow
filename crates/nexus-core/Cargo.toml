[package]
name = "nexus-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
arrow-select = "58.4.0"
async-trait = "0.1.91"
chrono = { version = "0.4.45", features = ["serde"] }
# Pipeline scheduling (cron-based automatic triggering) — see schedule.rs.
cron = "0.17.0"
datafusion = { version = "54.1.0", default-features = false, features = ["sql"] }
futures = "0.3.33"
inventory = "0.3.24"
# Generates the JSON Schema each connector publishes for its Config struct
# (ConnectorDescriptor.config_schema) — the UI's canvas builds a real form
# from this instead of a raw JSON textarea (see nexus-server's
# list_connectors_handler and frontend/src/components/SchemaForm.tsx).
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt", "sync", "macros", "time"] }
tracing = "0.1.44"
url = "2.5.4"
# Metrics API only (no SDK/exporter) — the same per-batch counters that
# feed ProgressEvent/the WebSocket also feed these, so nexus-server's
# Prometheus /metrics (Marco 9 task #20) is one source of truth, not two
# divergent counts. Actual meter provider/exporter wiring lives in
# nexus-server (this crate has no I/O — CLAUDE.md §8.3), calls here are
# no-ops until that's installed.
opentelemetry = { version = "0.32.0", default-features = false, features = ["metrics"] }
