[package]
name = "nexus-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arrow-array = "59.1.0"
arrow-schema = "59.1.0"
async-trait = "0.1.91"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.33"
inventory = "0.3.24"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros"] }
