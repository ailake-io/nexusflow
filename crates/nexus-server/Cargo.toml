[package]
name = "nexus-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# ELT mode (Marco 10, CLAUDE.md §4.4 "dbt é opcional") — shells out to the
# `dbt` CLI via tokio::process::Command, not a Rust dependency, so the only
# thing this feature gates is tokio's own "process" sub-feature plus the
# code path in dbt.rs. Without it, PipelineSpec.dbt still deserializes fine
# (it's just data), but a spec that sets it gets a clear "not compiled in"
# error instead of silently doing nothing.
dbt = ["tokio/process"]
# Embeddings pipeline stage: chunking + ONNX inference via nexus-ai. Off by
# default because it pulls in ort, hf-hub, tokenizers and ONNX binaries, which
# significantly increases build time and binary size when not needed.
embeddings = ["dep:nexus-ai", "nexus-ai/cpu"]
# Same embedding pipeline stage, but backed by an external HTTP API
# (nexus-ai's `api` feature) instead of a local ONNX model — no ort/hf-hub/
# tokenizers in the binary. Independent of `embeddings`; both can be on at
# once so a `PipelineSpec.embedding.model` of either backend tag works.
embeddings-api = ["dep:nexus-ai", "nexus-ai/api"]
# Single-binary deployment (Marco 11, CLAUDE.md §7): embeds frontend/dist
# into the binary via rust-embed and serves it (with SPA fallback) for any
# GET that doesn't match an API route. Off by default because rust-embed's
# `#[folder = "../../frontend/dist"]` requires that directory to exist at
# *compile* time — with the feature off, that derive is cfg-stripped
# before rust-embed's proc-macro ever runs, so a plain `cargo build`/CI's
# `--all-features` sweep (see dbt's same posture) never needs `npm run
# build` to have happened first. Build the frontend, then
# `cargo build --features embed-ui`, to get the real single binary.
embed-ui = ["dep:rust-embed"]

# Each connector under crates/nexus-connectors/ is its own crate, gated
# behind its own Cargo feature (ARCHITECTURE.md §3/CLAUDE.md §3: "compile
# time, tamanho de binário e a fronteira OSS/enterprise exigem que cada
# conector possa ser incluído/excluído do build independentemente"). Being
# linked in is *also* what makes a connector appear in GET /connectors —
# nexus_core::ConnectorRegistry is populated by each crate's own
# `submit_connector!` call at static-init time (see connectors.rs), which
# only runs if the crate is actually part of this binary.
#
# kafka/odbc forward their own inner Cargo feature ("consumer"/"legacy")
# because those two crates keep their native-linkage code (rdkafka /
# vendored unixODBC) behind an additional feature of their own — without
# forwarding it, the crate would compile but its `submit_connector!` call
# is itself `#[cfg]`-gated behind that inner feature, so it'd silently
# never show up in the catalog (see each crate's own src/lib.rs).
connectors-all = [
    "mongodb", "kafka", "rest", "odbc", "milvus", "qdrant", "lancedb",
    "pgvector", "pinecone", "chromadb", "deltalake", "iceberg", "parquet",
    "ailake", "csv", "embeddings", "embeddings-api",
    "postgres-cdc", "mysql-cdc", "deltalake-cdc", "iceberg-cdc", "ailake-cdc",
]
# Native logical-replication CDC for the always-linked "postgres" connector
# — forwards to that crate's own `cdc` feature (ARCHITECTURE.md §7), which
# is what actually gates its heavier pg_walstream/rustls-tls dependency.
postgres-cdc = ["nexus-connector-postgres/cdc"]
# MongoDB's Change Streams CDC source needs no extra dependency beyond the
# driver "mongodb" already pulls in, so it has no Cargo feature of its own
# in that crate — enabling "mongodb" here is enough to get "mongodb-cdc" in
# the connector catalog too.
mongodb = ["dep:nexus-connector-mongodb"]
mysql-cdc = ["dep:nexus-connector-mysql"]
kafka = ["dep:nexus-connector-kafka", "nexus-connector-kafka/consumer"]
rest = ["dep:nexus-connector-rest"]
odbc = ["dep:nexus-connector-odbc", "nexus-connector-odbc/legacy"]
milvus = ["dep:nexus-connector-milvus"]
qdrant = ["dep:nexus-connector-qdrant"]
lancedb = ["dep:nexus-connector-lancedb"]
pgvector = ["dep:nexus-connector-pgvector"]
pinecone = ["dep:nexus-connector-pinecone"]
chromadb = ["dep:nexus-connector-chromadb"]
deltalake = ["dep:nexus-connector-deltalake"]
iceberg = ["dep:nexus-connector-iceberg"]
parquet = ["dep:nexus-connector-parquet"]
ailake = ["dep:nexus-connector-ailake"]
# Native CDC for the 3 lakehouse formats (ARCHITECTURE.md §16) — each
# forwards to its own crate's `cdc` feature *and* pulls in the base
# optional dependency (unlike postgres-cdc/mysql-cdc above, these 3
# connectors aren't unconditionally linked, so enabling only the inner
# `cdc` feature without the base one would fail to compile).
deltalake-cdc = ["deltalake", "nexus-connector-deltalake/cdc"]
iceberg-cdc = ["iceberg", "nexus-connector-iceberg/cdc"]
ailake-cdc = ["ailake", "nexus-connector-ailake/cdc"]
csv = ["dep:nexus-connector-csv"]

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.104"
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["ws"] }
# Neither crypto backend is enabled by default in jsonwebtoken 11 — without
# picking one, encode/decode panics at runtime ("Could not automatically
# determine the process-level CryptoProvider"). rust_crypto is pure Rust
# (no aws-lc-rs/C build), consistent with this workspace's other crates.
# use_pem (pulls in `pem`/`simple_asn1`, also pure Rust) is needed for
# `DecodingKey::from_ed_pem`/`EncodingKey::from_ed_pem` — the enterprise
# license key's EdDSA verification (see license.rs).
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto", "use_pem"] }
# argon2's password-hash re-export of rand_core doesn't itself turn on
# rand_core's "getrandom" feature (that's what makes `OsRng` exist at all) —
# has to be requested directly here, at the exact rand_core 0.6.x version
# password-hash 0.5.0 depends on, or `SaltString::generate` has no RNG type
# that satisfies its `CryptoRngCore` bound.
rand_core = { version = "0.6.4", features = ["getrandom"] }
nexus-connector-postgres = { version = "0.1.0", path = "../nexus-connectors/nexus-connector-postgres" }
nexus-connector-sqlite = { version = "0.1.0", path = "../nexus-connectors/nexus-connector-sqlite" }
nexus-connector-mongodb = { version = "0.1.0", path = "../nexus-connectors/nexus-connector-mongodb", optional = true }
nexus-connector-mysql = { version = "0.1.0", path = "../nexus-connectors/nexus-connector-mysql", optional = true }
nexus-connector-kafka = { version = "0.1.0", path = "../nexus-connectors/nexus-connector-kafka", optional = true }
nexus-connector-rest = { version = "0.1.0", path = "../nexus-connectors/nexus-connector-rest", optional = true }
nexus-connector-odbc = { version = "0.1.0", path = "../nexus-connectors/nexus-connector-odbc", optional = true }
nexus-connector-milvus = { version = "0.1.0", path = "../nexus-connectors/nexus-connector-milvus", optional = true }
nexus-connector-qdrant = { version = "0.1.0", path = "../nexus-connectors/nexus-connector-qdrant", optional = true }
nexus-connector-lancedb = { version = "0.1.0", path = "../nexus-connectors/nexus-connector-lancedb", optional = true }
nexus-connector-pgvector = { version = "0.1.0", path = "../nexus-connectors/nexus-connector-pgvector", optional = true }
nexus-connector-pinecone = { version = "0.1.0", path = "../nexus-connectors/nexus-connector-pinecone", optional = true }
nexus-connector-chromadb = { version = "0.1.0", path = "../nexus-connectors/nexus-connector-chromadb", optional = true }
nexus-connector-deltalake = { version = "0.1.0", path = "../nexus-connectors/nexus-connector-deltalake", optional = true }
nexus-connector-iceberg = { version = "0.1.0", path = "../nexus-connectors/nexus-connector-iceberg", optional = true }
nexus-connector-parquet = { version = "0.1.0", path = "../nexus-connectors/nexus-connector-parquet", optional = true }
nexus-connector-ailake = { version = "0.1.0", path = "../nexus-connectors/nexus-connector-ailake", optional = true }
nexus-connector-csv = { version = "0.1.0", path = "../nexus-connectors/nexus-connector-csv", optional = true }
nexus-core = { version = "0.1.0", path = "../nexus-core" }
nexus-ai = { version = "0.1.0", path = "../nexus-ai", optional = true }
hex = "0.4.3"
# Pipeline scheduler (background cron polling, see scheduler.rs) — matches
# nexus-core's own cron/chrono versions (parse_cron_expression's return
# type is nexus-core's re-exported `cron::Schedule`, so this has to stay
# the same crate, not just a compatible one).
chrono = { version = "0.4.45", features = ["serde"] }
cron = "0.17.0"
dashmap = "6.2.1"
# Hardware stats (CPU/RAM) in the progress WebSocket — CLAUDE.md §6 "UI
# Real-Time: WebSockets transmitindo estatísticas de hardware".
sysinfo = "0.37.2"
# Email alert channel (alerts.rs) — rustls-tls, no native OpenSSL build,
# consistent with reqwest's own TLS choice elsewhere in this crate.
lettre = { version = "0.11.19", default-features = false, features = [
    "tokio1-rustls-tls",
    "smtp-transport",
    "builder",
] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "postgres",
    "chrono",
] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
# OTel trace export (Marco 9 task #19) — off by default (see telemetry.rs).
# This crate only asks for "trace" directly; "metrics" (task #20, used via
# opentelemetry::global::set_meter_provider in telemetry.rs) comes in
# through Cargo feature unification with nexus-core's own `opentelemetry`
# dependency, which needs it for the rows/bytes counters. The async trace
# batch exporter needs rt-tokio; reqwest-rustls matches this crate's other
# HTTP client (alerts.rs) even though it's a different reqwest major (OTLP
# 0.32 pins reqwest 0.13) — not worth fighting the ecosystem's version churn
# to unify two otherwise-unrelated HTTP stacks.
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = [
    "trace",
    "rt-tokio",
    "experimental_trace_batch_span_processor_with_async_runtime",
] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
    "trace",
    "http-proto",
    "reqwest-client",
    "reqwest-rustls",
] }
tracing-opentelemetry = { version = "0.33.0", default-features = false, features = ["tracing-log"] }
opentelemetry-prometheus = "0.32.0"
prometheus = "0.14.0"
rust-embed = { version = "8.12.0", optional = true, features = ["mime-guess"] }
arrow-array = "58.4.0"
arrow-json = "58.4.0"
arrow-schema = "58.4.0"
futures-util = "0.3.33"

[dev-dependencies]
async-trait = "0.1.91"
futures = "0.3.33"
futures-util = "0.3.33"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.3", features = ["util"] }
