[package]
name = "nexus-connector-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Native logical-replication CDC (`postgres-cdc`), no Debezium/Kafka in
# front — ARCHITECTURE.md §7. Gated behind its own feature (CLAUDE.md §8
# rule 5): pg_walstream's default rustls-tls backend needs cmake + a C
# compiler at build time (for aws-lc-rs), a cost the batch-only "postgres"
# connector shouldn't pay.
cdc = ["dep:pg_walstream"]

[dependencies]
adbc_core = "0.23.0"
adbc_driver_manager = "0.23.0"
arrow-array = "58.4.0"
arrow-buffer = "58.4.0"
arrow-cast = "58.4.0"
arrow-schema = "58.4.0"
async-trait = "0.1.91"
futures = "0.3.33"
nexus-core = { version = "0.1.0", path = "../../nexus-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = "1.2.2"
tokio = { version = "1.53.1", features = ["rt", "time"] }
pg_walstream = { version = "0.8.1", optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
tokio-postgres = "0.7.13"
testcontainers = "0.27.3"
