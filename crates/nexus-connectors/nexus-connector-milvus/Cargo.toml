[package]
name = "nexus-connector-milvus"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
async-trait = "0.1.91"
milvus-sdk-rust = "0.1.0"
nexus-core = { version = "0.1.0", path = "../../nexus-core" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt"] }

[dev-dependencies]
nexus-ai = { path = "../../nexus-ai", features = ["cpu"] }
testcontainers = "0.27.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
