[package]
name = "nexus-connector-kinesis"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# First AWS SDK dependency in either repo — confirmed no aws-sdk-* crate
# used anywhere else (S3 support elsewhere goes through the `object_store`
# crate's own embedded client instead). `Region`/`Credentials`/
# `BehaviorVersion` are all re-exported under `aws_sdk_kinesis::config`
# (confirmed via docs.rs for 1.113.0) — no separate aws-config/
# aws-credential-types/aws-types dependency needed.
[dependencies]
nexus-core = { version = "0.1.0", path = "../../nexus-core" }
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
async-trait = "0.1.91"
futures = "0.3.33"
aws-sdk-kinesis = "1.113.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = "1.2.2"
tokio = { version = "1.53.1", features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
