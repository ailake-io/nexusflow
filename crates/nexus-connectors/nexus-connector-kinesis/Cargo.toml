[package]
name = "nexus-connector-kinesis"
version.workspace = true
edition.workspace = true
license.workspace = true

# First AWS SDK dependency in this workspace — confirmed no other
# aws-sdk-* crate used anywhere else (S3 support goes through the
# `object_store` crate's own embedded client instead).
# `Region`/`Credentials`/`BehaviorVersion` are all re-exported under
# `aws_sdk_kinesis::config` — no separate aws-types dependency needed.
[dependencies]
nexus-core = { version = "0.2.0", path = "../../nexus-core" }
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
async-trait = "0.1.91"
futures = "0.3.33"
aws-sdk-kinesis = "1.113.0"
aws-config = "1"
aws-credential-types = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = "1.2.2"
tokio = { version = "1.53.1", features = ["rt", "time"] }
tracing = "0.1.41"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
