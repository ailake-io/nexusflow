[package]
name = "nexus-connector-csv"
version.workspace = true
edition.workspace = true
license.workspace = true

# `object_store` gives `uri` a single abstraction over local disk, S3, GCS
# and Azure Blob — same crate deltalake/lancedb already use under the hood
# for their own "uri can be a path or a cloud URL" contract, just used
# directly here since plain CSV/TXT has no table-format library of its own.
[dependencies]
arrow-array = "58.4.0"
arrow-csv = "58.4.0"
arrow-schema = "58.4.0"
arrow-select = "58.4.0"
async-trait = "0.1.91"
futures = "0.3.33"
nexus-core = { version = "0.1.0", path = "../../nexus-core" }
object_store = { version = "0.10.2", features = ["aws", "gcp", "azure", "http"] }
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1.2.2"
tokio = { version = "1.53.1", features = ["rt", "time"] }
url = "2.5.7"

[dev-dependencies]
tempfile = "3.14.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
