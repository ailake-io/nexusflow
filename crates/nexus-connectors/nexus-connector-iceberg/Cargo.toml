[package]
name = "nexus-connector-iceberg"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Native CDC via manual manifest diffing (`iceberg-cdc`) — `iceberg` 0.10.0
# has no built-in incremental scan, so this walks TableMetadata::snapshots/
# ManifestList/Manifest by hand (all public API already in the `iceberg`
# dependency below — no new dependency). Gated behind its own feature
# (CLAUDE.md §8 rule 5) purely so a build that doesn't need it doesn't pay
# for compiling the extra module — see ARCHITECTURE.md §7.
cdc = []

[dependencies]
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
async-trait = "0.1.91"
futures = "0.3.33"
iceberg = "0.10.0"
iceberg-catalog-sql = "0.10.0"
nexus-core = { version = "0.1.0", path = "../../nexus-core" }
parquet = "58.4.0"
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1.2.2"
# iceberg-catalog-sql only requires sqlx's "any" feature itself — the
# concrete SQLite driver must come from somewhere in the build (Cargo
# feature unification), so it's declared here directly. Matches the
# combination iceberg-catalog-sql's own tests use.
sqlx = { version = "0.8.1", default-features = false, features = ["any", "runtime-tokio", "sqlite", "tls-rustls"] }

[dev-dependencies]
tempfile = "3.14.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
