[package]
name = "nexus-connector-parquet"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
arrow-select = "58.4.0"
async-trait = "0.1.91"
bytes = "1"
futures = "0.3.33"
nexus-core = { version = "0.1.0", path = "../../nexus-core" }
object_store = { version = "0.10.2", features = ["aws", "gcp", "azure"] }
parquet = "58.4.0"
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1.2.2"
tokio = { version = "1.53.1", features = ["rt"] }
url = "2.5.7"

[dev-dependencies]
tempfile = "3.14.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
