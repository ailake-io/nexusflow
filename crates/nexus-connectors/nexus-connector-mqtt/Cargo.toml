[package]
name = "nexus-connector-mqtt"
version.workspace = true
edition.workspace = true
license.workspace = true

# rumqttc pulls in a real async MQTT client + rustls — kept behind a feature
# so the workspace default build never requires it, same pattern as kafka's
# `consumer` feature (CLAUDE.md §8.5).
[features]
default = []
client = ["dep:rumqttc-v4-next", "dep:tokio", "dep:rustls-native-certs", "dep:rustls-pemfile"]

[dependencies]
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
async-trait = "0.1.91"
futures = "0.3.33"
nexus-core = { version = "0.1.0", path = "../../nexus-core" }
rumqttc-v4-next = { version = "0.34.0", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
rustls-pemfile = { version = "2", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1.2.2"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["time"], optional = true }

[dev-dependencies]
testcontainers = { version = "0.27.3" }
testcontainers-modules = { version = "0.15.0", features = ["mosquitto"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
