[package]
name = "nexus-connector-kafka"
version.workspace = true
edition.workspace = true
license.workspace = true

# rdkafka pulls in librdkafka (a native C dependency) — kept behind a feature
# so the workspace default build never requires it, per CLAUDE.md §8.5.
[features]
default = []
consumer = ["dep:rdkafka", "dep:tokio"]

[dependencies]
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
async-trait = "0.1.91"
futures = "0.3.33"
nexus-core = { version = "0.1.0", path = "../../nexus-core" }
rdkafka = { version = "0.39.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["time"], optional = true }

[dev-dependencies]
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["kafka"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
