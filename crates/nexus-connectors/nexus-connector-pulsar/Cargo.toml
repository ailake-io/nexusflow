[package]
name = "nexus-connector-pulsar"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Own binary protocol (not HTTP/gRPC) via the streamnative `pulsar` crate
# — no wiremock coverage possible the way the REST-based connectors get.
[dependencies]
nexus-core = { version = "0.1.0", path = "../../nexus-core" }
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
async-trait = "0.1.91"
futures = "0.3.33"
pulsar = "6.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = "1.2.2"
tokio = { version = "1.53.1", features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
