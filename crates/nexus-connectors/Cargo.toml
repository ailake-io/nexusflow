[workspace]
resolver = "2"
members = [
    "nexus-connector-postgres",
    "nexus-connector-sqlite",
    "nexus-connector-rest",
    "nexus-connector-mongodb",
    "nexus-connector-mysql",
    "nexus-connector-kafka",
    "nexus-connector-mqtt",
    "nexus-connector-odbc",
    "nexus-connector-pgvector",
    "nexus-connector-qdrant",
    "nexus-connector-lancedb",
    "nexus-connector-milvus",
    "nexus-connector-pinecone",
    "nexus-connector-chromadb",
    "nexus-connector-ailake",
    "nexus-connector-parquet",
    "nexus-connector-deltalake",
    "nexus-connector-iceberg",
    "nexus-connector-csv",
    "nexus-connector-clickhouse",
    "nexus-connector-duckdb",
    "nexus-connector-redis",
    "nexus-connector-nats",
    "nexus-connector-rabbitmq",
    "nexus-connector-starburst",
    "nexus-connector-teradata",
    "nexus-connector-vertica",
    "nexus-connector-hana",
    "nexus-connector-oracle",
    "nexus-connector-mssql",
    "nexus-connector-redshift",
    "nexus-connector-bigquery",
    "nexus-connector-snowflake",
    "nexus-connector-databricks",
    "nexus-connector-elasticsearch",
    "nexus-connector-weaviate",
    "nexus-connector-vertex-vector-search",
    "nexus-connector-azure-ai-search",
]

[workspace.package]
version = "0.1.7"
edition = "2021"
license = "Apache-2.0"

# Full debug info on a workspace this size (lancedb/milvus/qdrant/mongodb
# each pull in huge dependency trees — Lance/DataFusion/arrow-flight,
# tonic+prost, the full mongodb driver) makes target/ big enough to fill a
# standard CI runner's disk. Line-tables-only keeps panic backtraces useful
# while cutting artifact size substantially.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
