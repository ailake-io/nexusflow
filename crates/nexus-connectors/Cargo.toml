    "nexus-connector-chromadb",
    "nexus-connector-ailake",
    "nexus-connector-parquet",
    "nexus-connector-deltalake",
    "nexus-connector-iceberg",
    "nexus-connector-csv",
    "nexus-connector-clickhouse",
