name: build-windows-installer

# Standalone .msi build — deliberately NOT part of the CI -> connectors-heavy
# -> Release chain (release.yml). Moved off the dedicated self-hosted
# Windows box to hosted `windows-latest` 2026-09-05 (repo went public same
# day, no more self-hosted NexusFlow Actions) — the vcpkg/OpenSSL setup
# that used to be a manual one-time step on that host is now an explicit
# `vcpkg install` step below, run fresh each time against the vcpkg
# GitHub's windows-latest image ships pre-installed
# (`$env:VCPKG_INSTALLATION_ROOT`). Not yet proven against a real run as of
# this commit — nexus-connector-mysql's mysql_cdc only supports native
# OpenSSL (no rustls option), which is what originally failed here before
# vcpkg was set up. This workflow only ever runs when a human explicitly
# triggers it (workflow_dispatch), never on push/PR, and never blocks or is
# blocked by CI/connectors-heavy/Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Existing release tag (e.g. v0.1.1, already published by
          release.yml) to attach the built .msi to via `gh release upload`.
          Leave blank to just build and upload the .msi as a workflow
          artifact, without publishing it anywhere.
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows-installer:
    name: build-windows-installer
    runs-on: windows-latest
    # 60 min wasn't enough on a real run (2026-09-05): the plain-OSS
    # `cargo build --release --features embed-ui,connectors-all` alone ran
    # 44+ min before the job's own timeout cancelled it mid-build, and this
    # step still has the enterprise binary rebuild after it. Bumped with
    # real headroom rather than guessing again.
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Same install-if-missing PowerShell block connectors-heavy.yml uses on
      # this runner (WSL's bash shadows Git Bash in PATH there, which
      # mangles dtolnay/rust-toolchain's internal temp-script path — see
      # that workflow's comment).
      - name: Install Rust stable
        shell: pwsh
        run: |
          $cargoBin = "$env:USERPROFILE\.cargo\bin"
          if (!(Get-Command rustc.exe -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            $shaBytes = (Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe.sha256 -UseBasicParsing).Content
            $expected = [System.Text.Encoding]::ASCII.GetString($shaBytes).Trim().Split()[0]
            $actual = (Get-FileHash -Algorithm SHA256 -Path rustup-init.exe).Hash
            if ($expected -ne $actual) {
              Write-Error "rustup-init checksum mismatch: expected $expected, got $actual"
              exit 1
            }
            ./rustup-init.exe -y --default-toolchain stable --no-modify-path
            Remove-Item rustup-init.exe
          }
          # rustup-init doesn't put cargoBin on PATH for *this* running
          # process (only future ones, and only if --no-modify-path were
          # dropped) — the $GITHUB_PATH appends below only take effect in
          # later steps. Without this, a first-ever run on a fresh runner
          # fails right here: "rustup: command not found".
          $env:Path = "$cargoBin;$env:Path"
          rustup default stable
          "$cargoBin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # Runs fresh every time now (ephemeral hosted runner, no persistent
      # one-time setup possible) — GitHub's windows-latest image ships
      # vcpkg pre-installed at $env:VCPKG_INSTALLATION_ROOT, so this is
      # "install one package into it" rather than a from-scratch vcpkg
      # bootstrap. `vcpkg integrate install` wires MSBuild to auto-link
      # vcpkg packages; openssl-sys's build.rs also needs VCPKG_ROOT set
      # explicitly to find it (persisted via $GITHUB_ENV for later steps).
      - name: Install vcpkg OpenSSL (static)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows-static-md
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          $opensslPkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows-static-md\lib\libssl.lib"
          if (!(Test-Path $opensslPkg)) {
            Write-Error "openssl:x64-windows-static-md install did not produce $opensslPkg"
            exit 1
          }

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      # Same real failure connectors-heavy.yml hit and fixed: lance-encoding
      # (pulled in by connectors-all's lancedb) needs a real `protoc` on
      # PATH, absent from windows-latest by default. Pinned zip + sha256,
      # same download as that workflow's fix.
      - name: Install protoc
        shell: pwsh
        run: |
          $protocVersion = "29.3"
          $protocSha256 = "57ea59e9f551ad8d71ffaa9b5cfbe0ca1f4e720972a1db7ec2d12ab44bff9383"
          $zipPath = "$env:TEMP\protoc.zip"
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v$protocVersion/protoc-$protocVersion-win64.zip" -OutFile $zipPath
          $actual = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $protocSha256) {
            Write-Error "protoc zip checksum mismatch: expected $protocSha256, got $actual"
            exit 1
          }
          Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\protoc" -Force
          "$env:TEMP\protoc\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # embed-ui bakes frontend/dist into the binary at compile time
      # (rust-embed) — must exist before `cargo build` below.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install cargo-wix
        run: |
          if (!(Get-Command cargo-wix.exe -ErrorAction SilentlyContinue)) {
            cargo install cargo-wix --locked
          }

      # Same feature set as release.yml's Linux build, so GET /connectors
      # matches across platforms. No ADBC drivers on Windows yet (see
      # packaging/windows/main.wxs's header comment) — Postgres/SQLite
      # connectors won't have a driver to dlopen until that's built too.
      - name: cargo build --release
        run: cargo build --release -p nexusflow --features embed-ui,connectors-all

      # Every distributed artifact now ships every enterprise connector
      # compiled in and license-gated, not just OSS's own connectors-all —
      # same reasoning as release.yml's Linux `build`/`docker-publish` jobs'
      # matching steps (see those comments for the full rationale and the
      # manual Docker Hub validation this was based on). Windows can't reuse
      # that Docker recipe (native msvc target, not a Linux container), so
      # this clones the enterprise repo directly and builds
      # `nexusflow-enterprise` from it with a `[patch]` redirecting its
      # nexus-core/nexus-server git dependency at this job's own
      # already-checked-out+frontend-built OSS tree (same trick the
      # enterprise Dockerfile itself uses, just against a local checkout
      # instead of a fresh clone) — the OSS `nexusflow` binary above can't
      # be patched into including enterprise connectors itself, since
      # nothing in this workspace depends on itself via the git URL a patch
      # could intercept.
      #
      # UNTESTED on a real Windows runner as of this comment (no Windows
      # machine available to validate locally) — `cargo wix`'s `--no-build`
      # flag below is assumed, not confirmed, to skip its own internal
      # `cargo build` (which would otherwise silently overwrite
      # target\release\nexusflow.exe with the plain-OSS binary right before
      # packaging, undoing the copy two steps down). If `--no-build` turns
      # out not to be the right flag name, `cargo wix` should fail loudly
      # (unrecognized argument) rather than silently ship the wrong binary —
      # confirm via a real `workflow_dispatch` run before trusting this path.
      - name: Clone nexus-connectors-enterprise (read-only deploy key)
        shell: pwsh
        env:
          DEPLOY_KEY: ${{ secrets.ENTERPRISE_REPO_DEPLOY_KEY }}
        run: |
          $sshDir = "$env:USERPROFILE\.ssh"
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $keyPath = "$sshDir\enterprise_deploy_key"
          # Real failure on a first real run (2026-09-05): OpenSSH on
          # Windows rejected the key outright ("invalid format"). Normalize
          # to LF-only and force a trailing newline before writing — an SSH
          # private key with CRLF line endings or a missing final newline
          # (either possible depending on how the GitHub secret's value was
          # entered) fails PEM parsing even though the key content itself
          # is correct. Untested whether this was the actual root cause;
          # it's a safe, idempotent normalization regardless.
          $normalizedKey = ($env:DEPLOY_KEY -replace "`r`n", "`n" -replace "`r", "`n").TrimEnd("`n") + "`n"
          [System.IO.File]::WriteAllText($keyPath, $normalizedKey)
          icacls $keyPath /inheritance:r /grant:r "$($env:USERNAME):(R)" | Out-Null
          ssh-keyscan.exe github.com 2>$null | Out-File -Append -Encoding ascii "$sshDir\known_hosts"
          $env:GIT_SSH_COMMAND = "ssh -i `"$keyPath`" -o IdentitiesOnly=yes"
          git clone --depth 1 ssh://git@github.com/ailake-io/nexus-connectors-enterprise.git enterprise-src
          Remove-Item $keyPath -Force

      - name: Build enterprise binary (all OSS + enterprise connectors)
        shell: pwsh
        run: |
          # Real failure on a first real run (2026-09-05): this step used
          # to overlay a "placeholder" nexus-connector-kinesis from
          # enterprise-src onto this OSS checkout — stale by the time this
          # ever actually ran. The OSS `nexusflow` repo has never had a
          # nexus-connector-kinesis crate at all (confirmed earlier this
          # same session: zero references anywhere in this repo), and the
          # enterprise repo's own Cargo.toml/bin/main.rs were fixed
          # separately (kinesis added as its own workspace member,
          # `extern crate` wired in `bin/main.rs`) so it no longer needs
          # this overlay — same fix already removed the matching dead step
          # from the enterprise Dockerfile. Removed here for the same
          # reason: `crates\nexus-connectors\nexus-connector-kinesis`
          # doesn't exist in this checkout, so `Remove-Item` on it failed
          # outright.
          New-Item -ItemType Directory -Force -Path enterprise-src\.cargo | Out-Null
          $repoRoot = (Get-Location).Path -replace '\\', '/'
          @"
          [patch."https://github.com/ailake-io/nexusflow.git"]
          nexus-core = { path = "$repoRoot/crates/nexus-core" }
          nexus-server = { path = "$repoRoot/crates/nexus-server" }
          "@ | Out-File -Encoding utf8 enterprise-src\.cargo\config.toml

          Push-Location enterprise-src
          # Forces the lockfile to re-resolve against the patch above —
          # same reasoning as the enterprise Dockerfile's matching step
          # (its own comment explains the silent-stale-patch failure mode
          # this avoids).
          Remove-Item -Force -ErrorAction SilentlyContinue Cargo.lock
          cargo generate-lockfile
          cargo build --release -p nexusflow-enterprise --features connectors-all-no-embeddings,dbt,python-transform,embed-ui,connectors-all
          Pop-Location
          Copy-Item enterprise-src\target\release\nexusflow-enterprise.exe target\release\nexusflow.exe -Force

      - name: cargo wix
        # cargo-wix dropped --input in favor of --include/-I for a custom
        # .wxs source file (the old flag now errors: "unexpected argument
        # '--input' found") — the positional INPUT argument now means the
        # package manifest (Cargo.toml) to build, not the .wxs path.
        # --package is required in a workspace (this repo is one) — without
        # it cargo-wix errors "Workspace detected. Please pass a package
        # name." instead of guessing which member to build. --no-build
        # skips cargo-wix's own internal build (see the "UNTESTED" comment
        # above) so it packages the enterprise binary just copied into
        # target\release\nexusflow.exe instead of silently rebuilding the
        # plain-OSS one over it.
        run: cargo wix --package nexusflow --include packaging\windows\main.wxs --no-build --nocapture

      - name: Locate the built .msi
        id: msi
        run: |
          $msi = Get-ChildItem -Path target\wix -Filter *.msi | Select-Object -First 1
          if (-not $msi) {
            Write-Error "cargo wix did not produce a .msi under target\wix"
            exit 1
          }
          "path=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$($msi.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Only needed when no `version` was given — the artifact is the
      # whole output then, a human downloads and publishes it by hand.
      # When `version` is given, "Attach to release" below uploads
      # straight from disk instead, so skip this — GitHub's Actions
      # artifact storage has a hard quota that (per its own docs) doesn't
      # recalculate for 6-12h even after deleting old artifacts, and this
      # step failing outright once already blocked an otherwise-successful
      # build from finishing.
      - uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a # v4.4.3
        if: inputs.version == ''
        with:
          name: nexusflow-windows-installer
          path: ${{ steps.msi.outputs.path }}

      # The GitHub CLI isn't preinstalled on this self-hosted runner (unlike
      # GitHub-hosted runners, which ship it by default) — install it once.
      # `winget install` hangs indefinitely here: it needs an interactive
      # session (Microsoft Store/App Installer prompts) that a runner
      # service running non-interactively never provides. Extract the
      # official release zip directly instead — same "pinned version +
      # sha256 check" pattern as the appimagetool download in ci.yml.
      - name: Install GitHub CLI
        if: inputs.version != ''
        run: |
          if (!(Get-Command gh.exe -ErrorAction SilentlyContinue)) {
            $ghVersion = "2.98.0"
            $ghSha256 = "c28c7b3b584967a05b74d9eaf7481bff24ddc34930bf2d6e442c148236561eb1"
            $zipPath = "$env:TEMP\gh.zip"
            Invoke-WebRequest -Uri "https://github.com/cli/cli/releases/download/v$ghVersion/gh_${ghVersion}_windows_amd64.zip" -OutFile $zipPath
            $actualSha256 = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
            if ($actualSha256 -ne $ghSha256) {
              Write-Error "gh CLI zip checksum mismatch: expected $ghSha256, got $actualSha256"
              exit 1
            }
            Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\gh-cli" -Force
            "$env:TEMP\gh-cli\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      # Only attaches to an existing GitHub Release when `version` was
      # given — otherwise the artifact above is the whole output, a human
      # downloads and publishes it by hand whenever ready.
      - name: Attach to release
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
          MSI_PATH: ${{ steps.msi.outputs.path }}
        run: gh release upload "$env:RELEASE_TAG" "$env:MSI_PATH" --clobber
