name: Main Pipeline Orchestrator

# Why this exists: the intended chain on `main` is CI -> connectors-heavy ->
# Release -> {docker-hub-publish, build-windows-installer,
# build-macos-installer}, sequenced across separate workflow files. In
# practice `workflow_run` has proven unreliable on this
# repo: `gh api repos/.../actions/workflows/release.yml/runs` shows zero
# `workflow_run`-triggered runs since 2026-09-26 — every Release since then
# was a manual `workflow_dispatch` — and connectors-heavy has never once
# auto-fired from a main-branch CI completion (same query against
# connectors-heavy.yml's own run history). GitHub's `workflow_run` delivery
# for this kind of cross-file chaining is a known pain point community-wide.
#
# This workflow replaces waiting on that event with actively driving each
# step via the API (`gh workflow run` + `gh run watch --exit-status`),
# which is synchronous and fails loudly instead of silently never firing.
# connectors-heavy.yml's own `workflow_run` trigger was removed outright
# (it never fired anyway, and CodeQL flagged a real cache-poisoning gap in
# its untrusted-sha checkout once it also gained a workflow_dispatch path —
# simplest fix was deleting the dead trigger). Release also accepts only
# dispatch from main. Docker Hub and installer workflows are dispatched
# here once after Release succeeds.
on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: main-pipeline
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    # CI (~15-20m) + connectors-heavy (observed up to ~30m) + Release
    # (observed ~20-25m) + the final fan-out dispatch, with slack for
    # `gh run watch`'s own polling overhead.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Waiting for CI to complete on $SHA..."
          for i in $(seq 1 120); do
            row="$(gh run list --workflow=ci.yml --branch main --limit 10 \
              --json headSha,status,conclusion \
              --jq "[.[] | select(.headSha==\"$SHA\")][0] // {}")"
            status="$(echo "$row" | jq -r '.status // "missing"')"
            if [ "$status" = "completed" ]; then
              conclusion="$(echo "$row" | jq -r '.conclusion')"
              echo "CI conclusion: $conclusion"
              if [ "$conclusion" != "success" ]; then
                echo "::error::CI did not succeed on $SHA, stopping pipeline."
                exit 1
              fi
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "::error::Timed out waiting for CI."
              exit 1
            fi
            sleep 30
          done

      - name: Run connectors-heavy and wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run connectors-heavy.yml --ref main
          run_id=""
          for i in $(seq 1 20); do
            run_id="$(gh run list --workflow=connectors-heavy.yml --branch main --limit 5 \
              --json databaseId,createdAt,event \
              --jq "[.[] | select(.event==\"workflow_dispatch\" and .createdAt>\"$before\")][0].databaseId // empty")"
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::Could not find the dispatched connectors-heavy run."
            exit 1
          fi
          echo "Watching connectors-heavy run $run_id"
          gh run watch "$run_id" --exit-status

      - name: Determine release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current_version="$(grep -A3 '^\[workspace.package\]' Cargo.toml | grep '^version' | head -1 | cut -d '"' -f2)"
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "$current_version" =~ $semver_re ]]; then
            echo "::error::Cargo workspace version must be plain semver (got: $current_version)"
            exit 1
          fi

          # A merge can leave Cargo.toml at the latest published version.
          # Use that version only when it has never been released; otherwise
          # advance the patch so the release gets a fresh immutable tag.
          latest_tag="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)"
          latest_version="${latest_tag#v}"
          base_version="$current_version"
          if [[ "$latest_version" =~ $semver_re ]]; then
            IFS=. read -r current_major current_minor current_patch <<< "$current_version"
            IFS=. read -r latest_major latest_minor latest_patch <<< "$latest_version"
            if (( current_major < latest_major || \
                  (current_major == latest_major && current_minor < latest_minor) || \
                  (current_major == latest_major && current_minor == latest_minor && current_patch <= latest_patch) )); then
              base_version="$latest_version"
            fi
          fi

          version="$base_version"
          while gh api "repos/$GH_REPO/git/ref/tags/v$version" >/dev/null 2>&1; do
            IFS=. read -r major minor patch <<< "$version"
            version="$major.$minor.$((patch + 1))"
          done

          echo "Release version: $version (Cargo: $current_version; latest release: ${latest_tag:-none})"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run Release and wait
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run release.yml --ref main -f version="$VERSION"
          run_id=""
          for i in $(seq 1 20); do
            run_id="$(gh run list --workflow=release.yml --branch main --limit 5 \
              --json databaseId,createdAt,event \
              --jq "[.[] | select(.event==\"workflow_dispatch\" and .createdAt>\"$before\")][0].databaseId // empty")"
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::Could not find the dispatched Release run."
            exit 1
          fi
          echo "Watching Release run $run_id"
          gh run watch "$run_id" --exit-status

      - name: Fan out to Docker Hub / Windows / macOS installers
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run docker-hub-publish.yml --ref main -f version="$VERSION"
          gh workflow run build-windows-installer.yml --ref main -f version="v$VERSION"
          gh workflow run build-macos-installer.yml --ref main -f version="v$VERSION"
