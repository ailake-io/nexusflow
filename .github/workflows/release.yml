name: Release

# Builds nexusflow-linux-x86_64.tar.gz and publishes it as a GitHub Release
# asset — what scripts/install.sh downloads. The tarball is: the release
# binary (--features embed-ui,connectors-all — every connector linked in,
# not just the two always-on ones, so GET /connectors lists the full
# catalog out of the box) plus the two ADBC driver libraries
# nexus-connector-postgres/-sqlite dlopen at runtime (no crates.io
# distribution of those exists — see nexus-connector-postgres/src/driver.rs,
# ARCHITECTURE.md §3). Also produces real native installers (.deb/.rpm/
# AppImage — scripts/package-{deb,rpm,appimage}.sh, staged from the same
# release binary+ADBC build as the tarball).
#
# arm64, Windows, and macOS are all out of scope for now (no installer, no
# CI build in this workflow):
# - arm64: no self-hosted equivalent to fall back to (unlike x86_64 above),
#   and the hosted ubuntu-24.04-arm runner is blocked by an account billing
#   issue (Settings > Billing and plans) — confirmed hitting even plain
#   ubuntu-latest/x86_64, not just macOS/Windows, before x86_64 got routed
#   to self-hosted. Re-add once billing is resolved — see git history for
#   the exact matrix entry.
# - Windows: build-windows (cargo-wix + packaging/windows/main.wxs, on the
#   same self-hosted machine connectors-heavy.yml uses) was here and did
#   run, but cargo build --features connectors-all failed for real —
#   nexus-connector-mysql's mysql_cdc dependency only supports native
#   OpenSSL (no rustls option), and that machine has no OpenSSL/vcpkg
#   installed. Needs manual one-time setup on that host before re-adding
#   (see git history for the removed job's full definition).
# - macOS: no self-hosted macOS runner exists, the hosted macos-13/14
#   runners hit the same billing block, and Mac isn't a current priority
#   (ROADMAP.md's Pendências ativas item 5).
#
# All jobs run self-hosted on the same Linux machine as ci.yml's heavy jobs
# — hosted ubuntu-latest runners are blocked account-wide by the billing
# issue mentioned above, so the release jobs cannot rely on them either.
# The `concurrency` group below serializes this workflow with CI (and with
# other release runs) so the shared machine never runs two heavy cargo builds
# at once.
#
# Continuous-release model, not tag-triggered: on `main`, this is the last
# stage of a deliberate chain — CI -> connectors-heavy -> Release build ->
# GitHub Release — so `build`/`github-release` only run once both of those
# already succeeded on that commit (see the `workflow_run` trigger below and
# each job's `if:`). `build` also runs on every PR targeting `main`
# independently of that chain, for pre-merge validation only — never
# `github-release` (no publish side effects on a PR). `github-release` derives
# its tag/name directly from the workspace version in Cargo.toml (currently
# v0.1.0) rather than requiring a separate `git tag` push — every successful
# run of the chain re-publishes that same version's release
# (softprops/action-gh-release upserts: new assets replace old ones on the
# existing tag rather than erroring) until someone bumps the workspace
# version, at which point a new tag/release is created instead.

on:
  # Last step of the CI -> connectors-heavy -> Release chain on main (see
  # connectors-heavy.yml's matching workflow_run trigger for step 2) —
  # `workflow_run` is the only way to sequence separate workflow files,
  # there's no cross-file `needs:`. The job-level `if:`s below only let
  # github-release actually run when connectors-heavy's main-branch run
  # succeeded.
  workflow_run:
    workflows: ["connectors-heavy"]
    types: [completed]
    branches: [main]
  # PR validation stays independent of the chain above — build is exercised
  # pre-merge, never github-release (no publish side effects on a PR).
  pull_request:
    branches: [main]

permissions:
  contents: read

# Same fixed group as ci.yml — all release jobs share the same physical
# self-hosted Linux machine as CI's heavy jobs. A fixed group with no
# github.ref/github.sha in the key serializes across every branch/PR, not
# just concurrent runs of the same one; cancel-in-progress: false queues
# the new run instead of cancelling in-progress work.
concurrency:
  group: ci-self-hosted-runner
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      matrix:
        include:
          # x86_64 routed to the same self-hosted machine ci.yml's
          # test/connectors/docker-image jobs use — GitHub-hosted runners are
          # blocked account-wide by a billing issue (Settings > Billing and
          # plans), confirmed hitting even plain ubuntu-latest, not just
          # macOS/Windows.
          - os: linux
            arch: x86_64
            runner: [self-hosted, Linux]
            self_hosted: true
          # arm64 (and macOS below) dropped from this matrix for now — no
          # self-hosted equivalent to fall back to (unlike x86_64 above),
          # and the hosted ubuntu-24.04-arm/macos-13/macos-14 runners are
          # all blocked by the same billing issue; a failing leg here was
          # also showing up as a red run every single time regardless of
          # x86_64's own outcome (even with fail-fast: false, which only
          # stops one leg's failure from *cancelling* another, not from
          # still being reported). Re-add arm64 once billing is resolved —
          # see git history for the exact matrix entry.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    # Concurrency is now handled at the workflow level (ci-self-hosted-runner
    # group) so the whole Release workflow serializes with ci.yml on the same
    # physical machine. Per-job concurrency is redundant and was removed.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # workflow_run's default ref/sha is the repo's default branch, not
          # the commit connectors-heavy just validated on main — pin
          # explicitly. github.sha already resolves correctly for
          # pull_request (the PR's merge commit), so this is a no-op there.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: release-${{ matrix.os }}-${{ matrix.arch }}
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # unixodbc-dev/libsasl2-dev/libssl-dev/zlib1g-dev are here for
      # connectors-all's two natively-linked connectors — nexus-connector-odbc
      # (odbc-api needs a driver manager to build/link against, ARCHITECTURE.md
      # §3) and nexus-connector-kafka (rdkafka's default "cmake-build" feature
      # compiles vendored librdkafka from source, which auto-detects SASL/SSL/
      # zlib and silently builds without those protocols if headers are
      # missing — installed here so the shipped binary has them). Skipped on
      # the self-hosted runner: no interactive sudo there (same posture as
      # ci.yml's test/connectors jobs), and these packages are assumed
      # already present on that host from prior setup.
      - name: Install native build deps for the ADBC drivers + connectors-all
        if: matrix.os == 'linux' && !matrix.self_hosted
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake pkg-config libpq-dev libsqlite3-dev libfmt-dev \
            unixodbc-dev libsasl2-dev libssl-dev zlib1g-dev

      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      - run: ./scripts/build-adbc-postgresql-driver.sh target/adbc
      - run: ./scripts/build-adbc-sqlite-driver.sh target/adbc

      - run: cargo build --release -p nexusflow --features embed-ui,connectors-all

      - name: Package tarball
        run: |
          stage="$(mktemp -d)"
          cp target/release/nexusflow "$stage/nexusflow-bin"
          cp target/adbc/libadbc_driver_postgresql.so "$stage/"
          cp target/adbc/libadbc_driver_sqlite.so "$stage/"
          tar -czf "nexusflow-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C "$stage" .

      - uses: actions/upload-artifact@v4
        with:
          name: nexusflow-${{ matrix.os }}-${{ matrix.arch }}
          path: nexusflow-${{ matrix.os }}-${{ matrix.arch }}.tar.gz

      # scripts/package-{deb,rpm,appimage}.sh existed but were never wired into
      # CI — only the raw tarball above was actually produced/released. Each
      # script hardcodes amd64/x86_64 (see their own headers), so gated to
      # that arch only; arm64 .deb/.rpm/AppImage is future work, not a
      # regression from this being narrower than the tarball matrix.
      - name: Build native Linux packages (deb/rpm/AppImage)
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'
        run: |
          # No sudo on the self-hosted runner (see the deps step above) —
          # rpmbuild and appimagetool must already be available on this host.
          if ! command -v rpmbuild >/dev/null; then
            echo "rpmbuild not found; install the 'rpm' package on the self-hosted host."
            exit 1
          fi
          if ! command -v appimagetool >/dev/null; then
            # Pinned to the continuous release's SHA-256; verify before use (M34).
            APP_IMAGE_SHA256="a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0"
            curl -fL -o /tmp/appimagetool \
              https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            echo "$APP_IMAGE_SHA256  /tmp/appimagetool" | sha256sum -c -
            chmod +x /tmp/appimagetool
            APPIMAGETOOL="/tmp/appimagetool --appimage-extract-and-run"
          fi
          ./scripts/package-deb.sh target/package
          ./scripts/package-rpm.sh target/package
          # appimagetool is itself an AppImage; --appimage-extract-and-run
          # avoids depending on FUSE being available on the runner.
          APPIMAGETOOL="${APPIMAGETOOL:-appimagetool --appimage-extract-and-run}" \
            ./scripts/package-appimage.sh target/package

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'
        with:
          name: nexusflow-linux-packages
          path: target/package/*

  # build-windows removed for now — cargo build --features connectors-all
  # failed for real on the self-hosted windows-connectors-heavy runner:
  # nexus-connector-mysql's mysql_cdc dependency only supports native
  # OpenSSL (no rustls option), and that machine has no OpenSSL/vcpkg
  # installed. Needs manual one-time setup on that host (vcpkg install
  # openssl:x64-windows-static-md + vcpkg integrate install + VCPKG_ROOT
  # env var), same category as cmake/WiX Toolset already being assumed
  # present there. Re-add once that's done — see git history for the full
  # job definition (last present as of this commit's parent).

  github-release:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    needs: build
    runs-on: [self-hosted, Linux]
    # Self-hosted Linux (same machine as everything else here) — hosted
    # ubuntu-latest is blocked account-wide by the billing issue described in
    # this file's header. Needs `sha256sum` present on the host (standard on
    # Ubuntu/Debian). GPG signing is intentionally omitted: the repo secrets
    # are not configured, so only unsigned assets + SHA256SUMS are published.
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # workflow_run's default ref/sha is the repo's default branch, not
          # the commit connectors-heavy just validated on main — pin
          # explicitly. github.sha already resolves correctly for
          # pull_request (the PR's merge commit), so this is a no-op there.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          current_version="$(grep -A3 '^\[workspace.package\]' Cargo.toml | grep '^version' | head -1 | cut -d '"' -f2)"
          version="$current_version"

          # Bump patch while a release already exists for this tag.
          while gh release view "v$version" >/dev/null 2>&1; do
            version="$(echo "$version" | awk -F. '{$NF+=1} OFS="."')"
          done

          if [ "$version" != "$current_version" ]; then
            sed -i "s/^version = \"[^\"]*\"/version = \"$version\"/" Cargo.toml
            git add Cargo.toml
            git commit -m "chore(release): bump version to v$version [skip ci]"
            git push origin main
          fi

          # Make sure subsequent steps read the bumped Cargo.toml.
          git checkout main
          git pull origin main
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.tar.gz *.deb *.rpm *.AppImage > SHA256SUMS
      - uses: softprops/action-gh-release@7b4da11513bf3f43f9999e90eabced41ab8bb048 # v2.2.0
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          # Each successful run on main bumps the patch version (if needed)
          # and creates a fresh release; assets are replaced only when the
          # version stays the same, which no longer happens on main.
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/SHA256SUMS
          generate_release_notes: true
