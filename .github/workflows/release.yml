name: Release

# Builds nexusflow-linux-<arch>.tar.gz for x86_64+arm64 and publishes them
# as GitHub Release assets — what scripts/install.sh downloads. Each
# tarball is: the release binary (--features embed-ui,connectors-all —
# every connector linked in, not just the two always-on ones, so
# GET /connectors lists the full catalog out of the box) plus the two ADBC
# driver libraries nexus-connector-postgres/-sqlite dlopen at runtime (no
# crates.io distribution of those exists — see
# nexus-connector-postgres/src/driver.rs, ARCHITECTURE.md §3).
#
# Both tarball builds are native (no cross-compilation): GitHub's own
# ubuntu-24.04-arm hosted runner covers linux/arm64 natively — avoids
# cross-compiling the ADBC C++ sources for a foreign arch/libc, which
# scripts/build-adbc-*-driver.sh isn't set up for.
#
# Linux x86_64 additionally produces real native installers (.deb/.rpm/
# AppImage — scripts/package-{deb,rpm,appimage}.sh, staged from the same
# release binary+ADBC build as the tarball). Windows gets its own job
# (build-windows, on the same self-hosted machine connectors-heavy.yml
# uses) producing a signed-later .msi via cargo-wix from
# packaging/windows/main.wxs — server binary only for now, no ADBC driver
# .dll build exists yet (see that file's header).
#
# macOS is out of scope for now (no installer, no CI build) — no
# self-hosted macOS runner exists (unlike Windows above), the hosted
# macos-13/14 runners hit an account billing block, and Mac isn't a
# current priority (ROADMAP.md's Pendências ativas item 5). Revisit once
# both of those are sorted out.
#
# Continuous-release model, not tag-triggered: `build`/`build-windows` run
# on every push to `main` *and* every PR targeting it (pre-merge validation,
# no publish side effects on a PR — see `docker-publish`/`publish`'s `if:`).
# `publish` derives its GitHub Release tag/name directly from the workspace
# version in Cargo.toml (currently v0.1.0) rather than requiring a separate
# `git tag` push — every merge to `main` re-publishes that same version's
# release (softprops/action-gh-release upserts: new assets replace old ones
# on the existing tag rather than erroring) until someone bumps the
# workspace version, at which point a new tag/release is created instead.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          # x86_64 routed to the same self-hosted machine ci.yml's
          # test/connectors/docker-image jobs use — GitHub-hosted runners are
          # blocked account-wide by a billing issue (Settings > Billing and
          # plans), confirmed hitting even plain ubuntu-latest, not just
          # macOS/Windows. arm64 has no self-hosted equivalent to fall back
          # to, so it stays hosted and blocked until that's resolved.
          - os: linux
            arch: x86_64
            runner: [self-hosted, Linux]
            self_hosted: true
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            self_hosted: false
          # macOS dropped from this matrix for now — no self-hosted macOS
          # runner exists (unlike Windows below), and the hosted macos-13/
          # macos-14 runners are blocked by the same billing issue; their
          # failure was also cancelling the Linux builds via the matrix's
          # default fail-fast. Not in scope yet per project priority either
          # way (ROADMAP.md's Pendências ativas item 5). Re-add once macOS
          # actually becomes a priority and billing (or a self-hosted mac)
          # is sorted out.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # unixodbc-dev/libsasl2-dev/libssl-dev/zlib1g-dev are here for
      # connectors-all's two natively-linked connectors — nexus-connector-odbc
      # (odbc-api needs a driver manager to build/link against, ARCHITECTURE.md
      # §3) and nexus-connector-kafka (rdkafka's default "cmake-build" feature
      # compiles vendored librdkafka from source, which auto-detects SASL/SSL/
      # zlib and silently builds without those protocols if headers are
      # missing — installed here so the shipped binary has them). Skipped on
      # the self-hosted runner: no interactive sudo there (same posture as
      # ci.yml's test/connectors jobs), and these packages are assumed
      # already present on that host from prior setup.
      - name: Install native build deps for the ADBC drivers + connectors-all
        if: matrix.os == 'linux' && !matrix.self_hosted
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake pkg-config libpq-dev libsqlite3-dev libfmt-dev \
            unixodbc-dev libsasl2-dev libssl-dev zlib1g-dev

      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      - run: ./scripts/build-adbc-postgresql-driver.sh target/adbc
      - run: ./scripts/build-adbc-sqlite-driver.sh target/adbc

      - run: cargo build --release -p nexusflow --features embed-ui,connectors-all

      - name: Package tarball
        run: |
          stage="$(mktemp -d)"
          cp target/release/nexusflow "$stage/nexusflow-bin"
          cp target/adbc/libadbc_driver_postgresql.so "$stage/"
          cp target/adbc/libadbc_driver_sqlite.so "$stage/"
          tar -czf "nexusflow-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C "$stage" .

      - uses: actions/upload-artifact@v4
        with:
          name: nexusflow-${{ matrix.os }}-${{ matrix.arch }}
          path: nexusflow-${{ matrix.os }}-${{ matrix.arch }}.tar.gz

      # scripts/package-{deb,rpm,appimage}.sh existed but were never wired into
      # CI — only the raw tarball above was actually produced/released. Each
      # script hardcodes amd64/x86_64 (see their own headers), so gated to
      # that arch only; arm64 .deb/.rpm/AppImage is future work, not a
      # regression from this being narrower than the tarball matrix.
      - name: Build native Linux packages (deb/rpm/AppImage)
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'
        run: |
          # No sudo on the self-hosted runner this now builds on (see the
          # deps step above) — rpmbuild is assumed already present there;
          # rpmbuild's own "command not found" is a clear enough failure if
          # it isn't, no need to duplicate that check here.
          if ! command -v rpmbuild >/dev/null; then
            sudo apt-get install -y rpm
          fi
          curl -fL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          ./scripts/package-deb.sh target/package
          ./scripts/package-rpm.sh target/package
          # appimagetool is itself an AppImage; --appimage-extract-and-run
          # avoids depending on FUSE being available on the runner.
          APPIMAGETOOL="/tmp/appimagetool --appimage-extract-and-run" \
            ./scripts/package-appimage.sh target/package

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'
        with:
          name: nexusflow-linux-packages
          path: target/package/*

  build-windows:
    name: build-windows
    # Dedicated Windows self-hosted runner — the same machine
    # connectors-heavy.yml uses. GitHub-hosted windows-latest/macos-* runners
    # are blocked by an account billing issue (Settings > Billing and plans);
    # this one is free and already proven to build the Rust workspace on
    # this repo.
    runs-on: [windows-connectors-heavy]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Same rationale as connectors-heavy.yml's identical step: this
      # runner's WSL bash sits earlier in PATH than Git Bash, which mangles
      # dtolnay/rust-toolchain's internal bash scripts — install/verify
      # rustup via PowerShell directly instead.
      - name: Install Rust stable
        shell: pwsh
        run: |
          $cargoBin = "$env:USERPROFILE\.cargo\bin"
          if (!(Get-Command rustc.exe -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            $shaBytes = (Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe.sha256 -UseBasicParsing).Content
            $expected = [System.Text.Encoding]::ASCII.GetString($shaBytes).Trim().Split()[0]
            $actual = (Get-FileHash -Algorithm SHA256 -Path rustup-init.exe).Hash
            if ($expected -ne $actual) {
              Write-Error "rustup-init checksum mismatch: expected $expected, got $actual"
              exit 1
            }
            ./rustup-init.exe -y --default-toolchain stable --no-modify-path
            Remove-Item rustup-init.exe
          }
          rustup default stable
          "$cargoBin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      # ADBC driver .dll build (Postgres/SQLite, MSVC + vcpkg libpq) doesn't
      # exist yet — see packaging/windows/main.wxs's header comment — so this
      # installer ships the server binary only, same scope as that spec.
      # nexus-connector-odbc links Windows' built-in ODBC Driver Manager
      # (odbc32.lib, part of the Windows SDK — no vcpkg needed there, unlike
      # unixODBC on Linux); nexus-connector-kafka's rdkafka-sys cmake-build
      # compiles vendored librdkafka from source same as Linux/macOS.
      - run: cargo build --release -p nexusflow --features embed-ui,connectors-all

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      # cargo-wix itself shells out to WiX Toolset v3's candle/light —
      # GitHub-hosted windows-latest images ship it preinstalled, but this
      # is the first time this self-hosted machine runs this job; if WiX
      # isn't already on PATH here, cargo-wix fails with its own clear
      # "candle.exe not found" error rather than silently, so it'll be
      # obvious from the log rather than needing a separate check here.
      - name: Build MSI
        run: cargo wix -p nexusflow --input packaging\windows\main.wxs --nocapture

      - uses: actions/upload-artifact@v4
        with:
          name: nexusflow-windows-x86_64
          path: target/wix/*.msi

  docker-publish:
    if: github.event_name == 'push'
    name: docker-publish
    needs: build
    runs-on: ubuntu-latest
    # linux/arm64 compiles connectors-all's full Rust workspace under QEMU
    # emulation (no native arm64 Docker builder wired up here, unlike the
    # `build` job above which uses a real ubuntu-24.04-arm runner for the
    # tarball) — emulated cargo builds run several times slower than
    # native, hence the generous timeout versus the amd64-only job this
    # replaced (60min).
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read version from Cargo.toml
        id: version
        run: |
          version="$(grep -A3 '^\[workspace.package\]' Cargo.toml | grep '^version' | head -1 | cut -d '"' -f2)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Requires the DOCKERHUB_USERNAME/DOCKERHUB_TOKEN repo secrets (Docker
      # Hub access token, not the account password) — not set by this change,
      # someone with repo admin needs to add them under Settings > Secrets.
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # No git tag to derive a semver pattern from under the continuous-release
      # model (see this file's header) — tag both registries directly off the
      # workspace version read above, same convention `publish`'s GitHub
      # Release tag uses, plus a floating `latest`.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/ailake/nexusflow
          tags: |
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: github.event_name == 'push'
    needs: [build, build-windows, docker-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read version from Cargo.toml
        id: version
        run: |
          version="$(grep -A3 '^\[workspace.package\]' Cargo.toml | grep '^version' | head -1 | cut -d '"' -f2)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.tar.gz *.deb *.rpm *.AppImage *.msi > SHA256SUMS
      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@01dd5d3ca463c7f10f7f4f7b4f177225ac661ee4 # v6.1.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Sign release artifacts
        run: |
          cd dist
          for f in *.tar.gz *.deb *.rpm *.AppImage *.msi SHA256SUMS; do
            gpg --batch --yes --armor --detach-sign --output "$f.asc" "$f"
          done
      - uses: softprops/action-gh-release@7b4da11513bf3f43f9999e90eabced41ab8bb048 # v2.2.0
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          # `main` is the release branch under this continuous-release model
          # (see this file's header comment) — every push re-publishes the
          # same tag with fresh assets until the workspace version bumps.
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.asc
            dist/*.deb
            dist/*.deb.asc
            dist/*.rpm
            dist/*.rpm.asc
            dist/*.AppImage
            dist/*.AppImage.asc
            dist/*.msi
            dist/*.msi.asc
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
          generate_release_notes: true
