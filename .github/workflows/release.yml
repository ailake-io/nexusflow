name: Release

# Builds nexusflow-linux-x86_64.tar.gz and publishes it as a GitHub Release
# asset — what scripts/install.sh downloads. The tarball is: the release
# binary, built from the private nexus-connectors-enterprise repo's
# Dockerfile (`build` job's "Build enterprise binary" step, below) so every
# OSS *and* every enterprise connector is linked in and license-gated — not
# just OSS's own connectors-all — so GET /connectors lists the full catalog
# and the Store always has enterprise connectors to sell, regardless of
# which install path (this tarball/.deb/.rpm/AppImage, docker-publish's
# image, or build-windows-installer.yml's .msi) someone picked. Plus the two
# ADBC driver libraries nexus-connector-postgres/-sqlite dlopen at runtime
# (no crates.io distribution of those exists — see
# nexus-connector-postgres/src/driver.rs, ARCHITECTURE.md §3). Also produces
# real native installers (.deb/.rpm/AppImage —
# scripts/package-{deb,rpm,appimage}.sh, staged from the same release
# binary+ADBC build as the tarball).
#
# arm64, Windows, and macOS are still out of *this* workflow's matrix as of
# this commit (no installer/CI build produced here yet) — not billing
# blockers anymore now that the repo is public and hosted Actions minutes
# are free/unmetered regardless of the org's private-repo billing issue,
# just not re-added yet as part of this specific migration pass:
# - arm64: no matrix leg here yet — `ubuntu-24.04-arm` is a normal hosted
#   label now, same free tier as `ubuntu-latest`. Re-add as its own matrix
#   entry when arm64 packaging becomes a priority.
# - Windows: `.msi` is built by the separate build-windows-installer.yml
#   workflow, not here — see that file for its own runner/setup story
#   (OpenSSL/vcpkg, mysql_cdc's native-TLS requirement).
# - macOS: specs exist in `packaging/macos/` but nothing builds them in CI
#   yet (ROADMAP.md's Pendências ativas item 5) — `macos-latest` is a normal
#   hosted runner now, same as Windows/Linux; this is a build-recipe gap to
#   fill, not an infra one.
#
# All jobs moved to `ubuntu-latest` 2026-09-05 (repo went public same day,
# same migration as ci.yml — see that file's header for the fuller
# reasoning). This is a bigger change here than in ci.yml: every job below
# used to pass files to the next one via a plain shared directory on the
# self-hosted machine's disk (`/tmp/nexusflow-release-artifacts/$run_id`,
# see each "Stage ... for downstream jobs"/"Fetch staged ..." step) instead
# of `actions/upload-artifact`/`download-artifact`, specifically to dodge
# the org's Actions artifact storage quota on this private repo ("Artifact
# storage quota has been hit... recalculated every 6-12 hours", blocked
# this exact chain once). That workaround only works when every job is the
# same physical machine — on ephemeral hosted runners each job gets its own
# fresh VM with no shared disk, so it's replaced below with real
# upload-artifact/download-artifact. Public repos get free/unlimited
# Actions artifact storage, which is what made the original quota problem
# possible in the first place — this shouldn't recur.
#
# Continuous-release model, not tag-triggered: on `main`, this is the last
# stage of a deliberate chain — CI -> connectors-heavy -> Release build ->
# GitHub Release — so `build`/`github-release` only run once both of those
# already succeeded on that commit (see the `workflow_run` trigger below and
# each job's `if:`). No separate PR-time path — a PR only gets exercised by
# this workflow if/when it's merged and runs the real chain; `workflow_dispatch`
# is the only other way in (manual escape hatch, see below). `github-release` derives
# its tag/name directly from the workspace version in Cargo.toml (currently
# v0.1.0) rather than requiring a separate `git tag` push — every successful
# run of the chain re-publishes that same version's release (the
# `github-release` job's own release-and-upload step upserts: new assets
# replace old ones on the existing tag via `gh release upload --clobber`
# rather than erroring) until someone bumps the workspace version, at which
# point a new tag/release is created instead.

on:
  # Last step of the CI -> connectors-heavy -> Release chain on main (see
  # connectors-heavy.yml's matching workflow_run trigger for step 2) —
  # `workflow_run` is the only way to sequence separate workflow files,
  # there's no cross-file `needs:`. The job-level `if:`s below only let
  # github-release actually run when connectors-heavy's main-branch run
  # succeeded, and connectors-heavy.yml itself only runs when CI succeeded
  # — so this single trigger already transitively requires both CI and
  # connectors-heavy to be green before Release does anything.
  #
  # No independent `pull_request:` trigger here on purpose (removed) — it
  # used to race CI instead of depending on it, so a PR could show this
  # workflow green while CI was still red on the very same commit. Release
  # only ever runs as step 3 of the chain above, or via the manual dispatch
  # below.
  workflow_run:
    workflows: ["connectors-heavy"]
    types: [completed]
    branches: [main]
  # Manual escape hatch: `workflow_run` delivery from GitHub can lag several
  # minutes behind the source workflow's completion (observed on this repo —
  # see git history around this line), and re-running the upstream
  # connectors-heavy run reuses its run id instead of emitting a fresh
  # `completed` event, so it doesn't reliably re-fire this trigger either.
  # `gh workflow run release.yml --ref main -f version=X.Y.Z` covers that gap
  # without editing anything — same pattern as ci.yml/connectors-heavy.yml's
  # own `workflow_dispatch`.
  #
  # `version` is required and has no default on purpose: this is the only
  # path where the version is a human decision rather than derived from
  # Cargo.toml (see the "Determine version" step) — forces whoever runs this
  # by hand to say explicitly what they're publishing instead of silently
  # reusing whatever happens to be committed.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0) — updates Cargo.toml and publishes/completes that tag"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Runs first, alone, before any packaging — real bug fixed here: this
  # used to live inside `github-release`, which only runs *after*
  # `build` (packaging reads the version straight out of Cargo.toml at
  # checkout time, baking it into every .deb/.rpm/.AppImage filename).
  # A `workflow_dispatch` bump (e.g. 0.1.1 -> 0.1.2) landed too late to
  # affect that run's own packages — they got built and named 0.1.1,
  # then uploaded onto the freshly-created v0.1.2 release anyway
  # (`gh release upload --clobber` only overwrites a same-named asset,
  # it doesn't remove a differently-named stale one), leaving a mix of
  # 0.1.1- and 0.1.2-named files on the v0.1.2 release. Determining
  # (and, if needed, bumping+pushing) the version *before* `build` even
  # starts means every later job checks out the exact same
  # already-correct commit via `outputs.sha`, not a moving `main`/
  # `github.sha` that might be stale or (per the "non-fast-forward"
  # failure this replaces) already behind another push.
  determine-version:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # workflow_run's default ref/sha is the repo's default branch, not
          # the commit connectors-heavy just validated on main — pin
          # explicitly. github.sha already resolves correctly for
          # workflow_dispatch, so this is a no-op there.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          current_version="$(grep -A3 '^\[workspace.package\]' Cargo.toml | grep '^version' | head -1 | cut -d '"' -f2)"

          # workflow_dispatch: the version is whatever was typed in, full
          # stop — never auto-derived. The automatic CI -> connectors-heavy
          # -> Release chain has no way to take input (workflow_run doesn't
          # carry one), so it always publishes/completes whatever version is
          # currently committed to Cargo.toml — no auto-bump. Concretely:
          # merging a change that doesn't touch Cargo.toml's version just
          # re-completes that same tag's release (upsert via `--clobber`
          # below) instead of minting a new one every single merge.
          if [ -n "${DISPATCH_VERSION:-}" ]; then
            version="$DISPATCH_VERSION"
          else
            version="$current_version"
          fi

          if [ "$version" != "$current_version" ]; then
            sed -i "s/^version = \"[^\"]*\"/version = \"$version\"/" Cargo.toml
            git add Cargo.toml
            git commit -m "chore(release): set version to v$version [skip ci]"
            # actions/checkout leaves a detached HEAD, not a local `main`
            # branch — `git push origin main` has nothing to push and fails
            # with "src refspec main does not match any". Push the commit
            # directly by ref instead; the working directory already has the
            # updated Cargo.toml (from the sed+commit above), no re-checkout
            # needed for subsequent steps to read it.
            git push origin HEAD:main
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: determine-version
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      # A real run (2026-09-05) showed the cost of the default fail-fast:
      # macOS failed on a real, unrelated bug (libpq pkg-config path) and
      # cancelled the Linux leg mid-build, wasting ~40 min of otherwise-fine
      # progress. One platform's failure shouldn't cancel the others.
      fail-fast: false
      matrix:
        include:
          # arm64 Linux still out of this matrix — not a billing block
          # anymore (this repo is public, hosted minutes are free/unmetered
          # regardless of the org's private-repo billing issue), just not
          # re-added yet as part of this runner migration. Re-add
          # ubuntu-24.04-arm as its own matrix leg whenever arm64 Linux
          # packaging becomes a priority — see git history for the exact
          # matrix entry this repo used to carry for it.
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
          # macOS added 2026-09-05, untested on real hardware. GitHub's
          # macos-latest is Apple Silicon (arm64). Real, documented gap:
          # ships OSS connectors only, not the enterprise-bundled binary
          # Linux/Windows get — the enterprise binary build (below) goes
          # through `docker build`, and Docker isn't available on GitHub's
          # hosted macOS runners at all (unlike Linux, and unlike Windows
          # where build-windows-installer.yml avoids Docker entirely via a
          # `[patch]`-redirected cargo build instead). Same non-Docker
          # `[patch]` trick could extend this to macOS later — not done
          # here, scoped down to get a working OSS build shipped first.
          - os: macos
            arch: arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Pinned to determine-version's exact output commit (post-bump if
          # it bumped) — not github.sha/workflow_run.head_sha, which would
          # be the pre-bump commit and re-introduce the version-mismatch
          # bug this job ordering exists to fix.
          ref: ${{ needs.determine-version.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: release-${{ matrix.os }}-${{ matrix.arch }}
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # unixodbc-dev/libsasl2-dev/libssl-dev/zlib1g-dev are here for
      # connectors-all's two natively-linked connectors — nexus-connector-odbc
      # (odbc-api needs a driver manager to build/link against, ARCHITECTURE.md
      # §3) and nexus-connector-kafka (rdkafka's default "cmake-build" feature
      # compiles vendored librdkafka from source, which auto-detects SASL/SSL/
      # zlib and silently builds without those protocols if headers are
      # missing — installed here so the shipped binary has them). Unconditional
      # now that this always runs on a fresh ubuntu-latest VM (no host-level
      # "already installed" assumption to skip past anymore).
      - name: Install native build deps for the ADBC drivers + connectors-all
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake pkg-config libpq-dev libsqlite3-dev libfmt-dev \
            unixodbc-dev libsasl2-dev libssl-dev zlib1g-dev

      # macos-latest ships cmake/pkg-config already; unixodbc/libpq/fmt do
      # not (Homebrew is preinstalled, used here instead of apt). No
      # libsasl2/zlib equivalent installed — untested whether Homebrew's
      # system zlib is sufficient for rdkafka's cmake-build feature to find
      # SASL/zlib on its own; same "not yet proven" caveat as the rest of
      # this macOS leg.
      #
      # Real failure on a first real run (2026-09-05): libpq is keg-only in
      # Homebrew (deliberately not linked into /opt/homebrew, to avoid
      # conflicting with other Postgres installs) — its .pc file lives
      # under `brew --prefix libpq`/lib/pkgconfig, outside pkg-config's
      # default search path, so `pkg_check_modules(libpq)` failed outright
      # ("Package 'libpq' not found") even though it was installed.
      - name: Install native build deps (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install unixodbc libpq fmt protobuf
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      - run: ./scripts/build-adbc-postgresql-driver.sh target/adbc
      - run: ./scripts/build-adbc-sqlite-driver.sh target/adbc

      # Every distributed artifact (this tarball, the .deb/.rpm/AppImage
      # below, docker-publish's image, and build-windows-installer.yml's
      # .msi) now ships every enterprise connector compiled in and
      # license-gated (LICENSING.md §2/§3, docs/ENTERPRISE_LICENSING.md),
      # not just the OSS ones — so the Store always has something to sell
      # regardless of which install path a user picked, instead of only the
      # people who happened to pull the separate Docker Hub enterprise image.
      # Source of the private nexus-connectors-enterprise repo never enters
      # this one; only the compiled binary does, via a read-only deploy key
      # (`ENTERPRISE_REPO_DEPLOY_KEY` secret — GitHub org policy required
      # deploy keys to be explicitly enabled for that repo before this could
      # be added). Validated manually first (2026-09-01,
      # `thiagolange/nexusflow:latest` Docker Hub build+push+compose smoke
      # test — 71 connectors in the catalog, 41 unlocked once a license was
      # installed) before wiring it in here.
      #
      # Builds via the enterprise repo's own Dockerfile (`--target builder`,
      # stopping before its final slim runtime stage) rather than
      # re-deriving the cargo/frontend/ADBC steps a third time (this repo's
      # `build` job, the enterprise repo's Dockerfile, and
      # build-windows-installer.yml's native build already make two) — that
      # Dockerfile is the proven recipe, and it clones its own pinned
      # `nexusflow` checkout independently rather than reusing this job's,
      # so there's no risk of it seeing an inconsistent tree.
      #
      # KNOWN GAP as of the 2026-09-05 hosted-runner migration: `--ssh
      # default` forwards an ssh-agent for that internal clone of
      # `nexusflow` — on the old self-hosted box this worked because a
      # persistent ssh-agent with the maintainer's own key was already
      # running for unrelated reasons; a fresh `ubuntu-latest` runner has
      # no such agent, so this step will fail outright ("no ssh agent
      # found" or similar) until one of two things happens: (a) the
      # private enterprise repo's Dockerfile is updated to clone
      # `ailake-io/nexusflow` over plain HTTPS instead of SSH — the clean
      # fix, since `nexusflow` is now public and needs no credential to
      # clone at all — or (b) an explicit `ssh-agent`/`ssh-add` step is
      # added here with a credential scoped to `nexusflow`. Not fixed in
      # this commit: (a) requires editing the other (private) repo, out of
      # scope of this change here.
      #
      # Linux only — the enterprise binary is built via `docker build`
      # below, and Docker isn't available on GitHub's hosted macOS
      # runners. macOS instead gets a plain OSS build, see the next step.
      - name: Clone nexus-connectors-enterprise (read-only deploy key)
        if: matrix.os == 'linux'
        env:
          DEPLOY_KEY: ${{ secrets.ENTERPRISE_REPO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p -m 0700 ~/.ssh
          printf '%s' "$DEPLOY_KEY" > ~/.ssh/enterprise_deploy_key
          chmod 600 ~/.ssh/enterprise_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/enterprise_deploy_key -o IdentitiesOnly=yes" \
            git clone --depth 1 ssh://git@github.com/ailake-io/nexus-connectors-enterprise.git \
            enterprise-src
          rm -f ~/.ssh/enterprise_deploy_key

      - name: Build enterprise binary (all OSS + enterprise connectors)
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build --ssh default --target builder \
            --build-arg NEXUSFLOW_REV=${{ needs.determine-version.outputs.sha }} \
            --build-arg ENTERPRISE_FEATURES=connectors-all \
            -t nexusflow-enterprise-builder-${{ github.run_id }} \
            enterprise-src
          cid="$(docker create nexusflow-enterprise-builder-${{ github.run_id }})"
          mkdir -p target/release
          docker cp "$cid:/tmp/nexusflow-enterprise-bin" target/release/nexusflow
          docker cp "$cid:/out/libadbc_driver_postgresql.so" target/adbc/libadbc_driver_postgresql.so
          docker cp "$cid:/out/libadbc_driver_sqlite.so" target/adbc/libadbc_driver_sqlite.so
          docker rm "$cid" >/dev/null
          docker rmi nexusflow-enterprise-builder-${{ github.run_id }} >/dev/null

      # macOS: no enterprise bundling yet (see the "KNOWN GAP" comment
      # above the Docker-based steps this replaces) — plain OSS binary,
      # every OSS connector still linked in via connectors-all.
      - name: Build plain OSS binary (macOS)
        if: matrix.os == 'macos'
        run: cargo build --release -p nexusflow --features embed-ui,connectors-all

      - name: Package tarball
        run: |
          stage="$(mktemp -d)"
          cp target/release/nexusflow "$stage/nexusflow-bin"
          cp target/adbc/libadbc_driver_postgresql.* "$stage/"
          cp target/adbc/libadbc_driver_sqlite.* "$stage/"
          tar -czf "nexusflow-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C "$stage" .

      - name: Upload tarball for downstream jobs
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a # v4.3.6
        with:
          name: nexusflow-tarball-${{ matrix.os }}-${{ matrix.arch }}
          path: nexusflow-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          retention-days: 1

      # Bundled, self-contained CPython + pandas/pyarrow/dbt-core/dbt-postgres
      # (scripts/build-python-runtime.sh) — package-{deb,rpm,appimage}.sh
      # below all fail fast if target/python-runtime/python is missing, so
      # this has to run before them. Same x86_64-only scope as those scripts
      # (the release build only downloads the linux-x86_64 python-build-
      # standalone tarball).
      - name: Build bundled Python runtime (python-transform/dbt features)
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'
        run: ./scripts/build-python-runtime.sh target/python-runtime

      # scripts/package-{deb,rpm,appimage}.sh existed but were never wired into
      # CI — only the raw tarball above was actually produced/released. Each
      # script hardcodes amd64/x86_64 (see their own headers), so gated to
      # that arch only; arm64 .deb/.rpm/AppImage is future work, not a
      # regression from this being narrower than the tarball matrix.
      - name: Build native Linux packages (deb/rpm/AppImage)
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'
        run: |
          if ! command -v rpmbuild >/dev/null; then
            sudo apt-get update && sudo apt-get install -y rpm
          fi
          if ! command -v appimagetool >/dev/null; then
            # Pinned to appimagetool 1.9.1 release (M34).
            APP_IMAGE_SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
            curl -fL -o /tmp/appimagetool \
              https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
            echo "$APP_IMAGE_SHA256  /tmp/appimagetool" | sha256sum -c -
            chmod +x /tmp/appimagetool
            APPIMAGETOOL="/tmp/appimagetool --appimage-extract-and-run"
          fi
          ./scripts/package-deb.sh target/package
          ./scripts/package-rpm.sh target/package
          # appimagetool is itself an AppImage; --appimage-extract-and-run
          # avoids depending on FUSE being available on the runner.
          APPIMAGETOOL="${APPIMAGETOOL:-appimagetool --appimage-extract-and-run}" \
            ./scripts/package-appimage.sh target/package

      - name: Upload native packages for downstream jobs
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a # v4.3.6
        with:
          name: nexusflow-native-packages-${{ matrix.os }}-${{ matrix.arch }}
          path: target/package/*
          retention-days: 1

  # build-windows removed for now — cargo build --features connectors-all
  # failed for real on the self-hosted windows-connectors-heavy runner:
  # nexus-connector-mysql's mysql_cdc dependency only supports native
  # OpenSSL (no rustls option), and that machine has no OpenSSL/vcpkg
  # installed. Needs manual one-time setup on that host (vcpkg install
  # openssl:x64-windows-static-md + vcpkg integrate install + VCPKG_ROOT
  # env var), same category as cmake/WiX Toolset already being assumed
  # present there. Re-add once that's done — see git history for the full
  # job definition (last present as of this commit's parent).

  smoke-test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    needs: [determine-version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tarball
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: nexusflow-tarball-linux-x86_64
          path: dist
      - name: Smoke test tarball
        run: |
          cd dist
          tar -xzf nexusflow-linux-x86_64.tar.gz
          ./nexusflow-bin --version

  github-release:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
    needs: [determine-version, build, smoke-test]
    runs-on: ubuntu-latest
    # ubuntu-latest ships `sha256sum` by default. GPG signing is
    # intentionally omitted: the repo secrets are not configured, so only
    # unsigned assets + SHA256SUMS are published.
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # No checkout here — version comes from `determine-version`'s output
      # now (that job already did the only thing this one used to need a
      # working tree for), and everything else below just downloads
      # artifacts and shells out to `gh`.
      - name: Download tarball (linux-x86_64)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: nexusflow-tarball-linux-x86_64
          path: dist
      - name: Download native packages
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: nexusflow-native-packages-linux-x86_64
          path: dist
      - name: Download tarball (macos-arm64)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: nexusflow-tarball-macos-arm64
          path: dist
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.tar.gz *.deb *.rpm *.AppImage > SHA256SUMS
      - name: Create release and upload assets one at a time
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No `actions/checkout` in this job anymore (see the step above) —
          # `gh` normally infers the repo from the current directory's git
          # remote, which no longer exists here, so every call below is
          # explicit about `--repo` instead.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${{ needs.determine-version.outputs.version }}"

          # softprops/action-gh-release uploads every asset concurrently in
          # one call, which repeatedly failed on this runner's connection to
          # GitHub's upload API ("Request body length does not match
          # content-length header") for the large binaries specifically —
          # small files always succeeded. `gh release upload`, invoked once
          # per file in a loop, uploads strictly sequentially instead.
          #
          # Idempotent: a prior failed attempt may have already created the
          # release (with some assets missing) — `create` only if it isn't
          # there yet, and `--clobber` lets upload replace whatever partial
          # assets exist from that attempt.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes \
              --target "${{ needs.determine-version.outputs.sha }}"
          fi

          for f in dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.AppImage dist/SHA256SUMS; do
            gh release upload "$tag" "$f" --clobber
          done

  docker-publish:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
    needs: [determine-version, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      # Builds from the private nexus-connectors-enterprise repo's own
      # Dockerfile now, not this repo's — same reasoning as `build`'s
      # equivalent step above: every published artifact ships every
      # enterprise connector, license-gated, so the Store always has
      # something to sell no matter which install path a user picked.
      # `enterprise-src`'s Dockerfile clones its own pinned `nexusflow`
      # checkout internally, so no checkout of *this* repo is needed here at
      # all — only its Cargo.toml version (already resolved into
      # `determine-version`'s output) and its commit sha (passed as
      # NEXUSFLOW_REV below, so the image matches the exact commit being
      # released) are used.
      - name: Clone nexus-connectors-enterprise (read-only deploy key)
        env:
          DEPLOY_KEY: ${{ secrets.ENTERPRISE_REPO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p -m 0700 ~/.ssh
          printf '%s' "$DEPLOY_KEY" > ~/.ssh/enterprise_deploy_key
          chmod 600 ~/.ssh/enterprise_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/enterprise_deploy_key -o IdentitiesOnly=yes" \
            git clone --depth 1 ssh://git@github.com/ailake-io/nexus-connectors-enterprise.git \
            enterprise-src
          rm -f ~/.ssh/enterprise_deploy_key

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=v${{ needs.determine-version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image (full)
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
        with:
          context: enterprise-src
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same known gap as `build` job's identically-named clone step
          # above: no ssh-agent exists on a fresh hosted runner for this to
          # forward. Not fixed here — see that comment.
          ssh: default
          build-args: |
            NEXUSFLOW_REV=${{ needs.determine-version.outputs.sha }}
            ENTERPRISE_FEATURES=connectors-all

  # Keeps `develop` from drifting behind `main` after a release —
  # `determine-version` may have pushed a version-bump commit straight to
  # `main` (see that job's step), which `develop` never gets otherwise. Runs
  # once the release itself is confirmed published (needs github-release,
  # not just build/smoke-test), so a failed release never touches `develop`.
  # Force-push, not a merge: the intent is "develop == main exactly" after
  # every release, not a best-effort fast-forward — a merge would either
  # no-op (already a fast-forward) or fail/create a merge commit the moment
  # develop has any commit main doesn't, which defeats the point. Anything
  # unmerged on `develop` at release time is expected to already be in
  # `main` via the PR that triggered this chain in the first place.
  sync-develop:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
    needs: [determine-version, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.determine-version.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Force-push main onto develop
        run: git push origin ${{ needs.determine-version.outputs.sha }}:refs/heads/develop --force
