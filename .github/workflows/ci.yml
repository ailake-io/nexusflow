name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

# Repo went public 2026-09-05. All jobs below moved from a shared
# self-hosted desktop to `ubuntu-latest` (free/unmetered Actions minutes
# on a public repo) at the same time, at the user's explicit request —
# a stranger's fork/PR now runs whatever `runs-on:` says, and hosted
# runners are ephemeral per-run (nothing to protect with the old
# self-hosted `concurrency:` group, removed here). This workflow uses
# plain `pull_request` (checks out the fork's code with a restricted
# default `GITHUB_TOKEN`, no repo secrets in scope), never
# `pull_request_target` — combined with GitHub's default requirement
# that a maintainer approve Actions runs for a first-time outside
# contributor, that's the real protection against a malicious PR now
# that there's no self-hosted box for one to reach anyway.
#
# Known real risk carried over from the self-hosted era, not yet
# re-verified on hosted as of this migration: the heavy jobs below
# (docker-image/clippy/test/connectors — full `connectors-all` +
# `embed-ui`, lancedb/milvus/mongodb's huge dependency trees) previously
# blew past a GitHub-hosted runner's disk cap during linking ("ld
# terminated with signal 7 [Bus error]", 39MB free — see each job's own
# comment for the fuller history) and needed system packages
# (libpq-dev/libsqlite3-dev/libfmt-dev/protobuf-compiler/unixodbc-dev/
# cyrus-sasl) that the old self-hosted box had pre-installed once,
# outside this repo's version control. Both are addressed inline below
# (a disk-reclaim step + explicit `apt-get install`), but neither has
# been proven against a real hosted run yet at the time of this commit —
# treat the next CI run on this file as the actual test, not this
# comment's intent.
#
# `needs:` between jobs is gone entirely — nothing here was ever a real
# data dependency (every job that needs frontend/dist builds it inline
# itself; no job downloads another's artifact), the old chain existed
# purely to force one-at-a-time execution on the shared self-hosted
# machine. All 8 jobs now run independently and in parallel.

env:
  CARGO_TERM_COLOR: always

jobs:
  # Checks both Cargo.lock files (root + crates/nexus-connectors' own nested
  # workspace — see the `connectors` job's comment below on why that one is
  # gitignored and only exists as a build byproduct) against the RustSec
  # advisory database. The nested workspace's own Cargo.lock is generated
  # fresh by this step's own `cargo audit` run (nothing to check out for
  # it), unlike the drift check against the root lockfile (see the
  # `connectors` job), which needs a `cargo check` to have run first.
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
      - run: cargo install cargo-audit --locked
      # --ignore entries below were each traced with `cargo tree -i <crate>`
      # to confirm there's no fix reachable today without breaking a version
      # pin this repo already relies on deliberately — don't add to this
      # list without doing the same trace:
      #   RUSTSEC-2023-0071 (rsa, via jsonwebtoken's RS256 support) — the
      #     advisory itself says "No fixed upgrade is available!"; a known,
      #     ecosystem-wide, currently-unfixable issue for anyone signing JWTs
      #     with RSA via `jsonwebtoken`.
      #   RUSTSEC-2026-0194 / -0195 (quick-xml, via object_store <-
      #     datafusion 54.1.0) — object_store pins quick-xml `^0.39.0`
      #     exactly; the fix needs a newer datafusion, which needs arrow 59+
      #     (ROADMAP.md's "Débitos conhecidos" already tracks that pin).
      #   RUSTSEC-2025-0009 / RUSTSEC-2024-0336 (ring / rustls, via
      #     milvus-sdk-rust's tonic 0.8.3) — nexus-connector-milvus's only
      #     SDK option; no newer milvus-sdk-rust release exists with a newer
      #     tonic to move to.
      #   RUSTSEC-2026-0258 (h2 unbounded empty DATA frames) — same
      #     milvus-sdk-rust tonic 0.8.3 chain (tonic -> hyper 0.14 -> h2
      #     0.3.27, no fix in the 0.3.x line, only ">=0.4.16"). The *other*
      #     h2 instance in the tree (via the modern hyper/reqwest stack)
      #     already got `cargo update`d past the fix. This one's also low
      #     risk here specifically: nexus-connector-milvus only ever dials
      #     *out* to a Milvus server as an HTTP/2 client — the DoS is a
      #     server-side resource-exhaustion vector, and we never terminate
      #     inbound HTTP/2 through this dependency chain.
      #
      # Batch added together (2026-09-01, connector-expansion PR #69) — the
      # RustSec DB simply gained these entries since cargo-audit last ran
      # clean; traced every one with `cargo tree -i --all-features` and
      # confirmed none come from that PR's 4 new connector crates
      # (duckdb/redis/nats/rabbitmq) or the Kafka sink — all are pre-existing
      # transitive deps of connectors that were already in the tree. Deferred
      # rather than upgraded in that PR to not block it; a real upgrade pass
      # (especially rustls-webpki, which has real advisories with fixes) is
      # tracked as follow-up, not resolved here:
      #   RUSTSEC-2026-0099 / -0098 / -0049 / -0104 (rustls-webpki 0.102.8,
      #     via milvus-sdk-rust's pinned tonic 0.8.3 -> rustls-native-certs
      #     0.6.3, same frozen chain as RUSTSEC-2026-0258 above) — real
      #     advisories with fixes ("Upgrade to >=0.103.x"), but the fix isn't
      #     reachable without breaking the same tonic 0.8.3 pin already
      #     documented above. Low risk here for the same reason as -0258:
      #     outbound-only TLS client to a Milvus server, not an inbound
      #     endpoint parsing attacker-supplied certs/CRLs.
      #   RUSTSEC-2025-0134 (rustls-pemfile 1.0.4 via milvus's tonic chain,
      #     and 2.2.0 via mysql_async/mqtt/object_store/async-nats) —
      #     "unmaintained", no CVE; the crate still does one job (PEM
      #     parsing) correctly, replacement means a rustls-stack bump on
      #     several unrelated connectors at once.
      #   RUSTSEC-2025-0010 (ring 0.16.20, same milvus tonic 0.8.3 chain) —
      #     "unmaintained" (pre-0.17), same "no upgrade without breaking the
      #     tonic 0.8.3 pin" story as the entries above it.
      #   RUSTSEC-2023-0086 (lexical-core 0.8.5, via arrow-cast -> arrow ->
      #     datafusion -> nexus-core) — "unsound", core Arrow/DataFusion
      #     dependency; no override without breaking the datafusion 54.1.0
      #     pin (same one RUSTSEC-2026-0194/-0195 above already accept).
      #   RUSTSEC-2026-0002 / -0253 (lru 0.12.5 via tantivy -> ailake-fts,
      #     and 0.16.4 via mysql_async -> nexus-connector-mysql) — "unsound"
      #     internal-iterator/panic-safety issues; two independent trees each
      #     pin their own lru major version transitively, no single `cargo
      #     update` reaches both.
      #   RUSTSEC-2025-0141 / -2024-0384 / -2025-0119 / -2024-0436 / -2026-0173
      #     (bincode 1.3.3, instant 0.1.13, number_prefix 0.4.0, paste
      #     1.0.15, proc-macro-error2 2.0.1) — all "unmaintained", no CVE;
      #     small leaf deps of the ailake/tantivy and indicatif chains with
      #     no drop-in replacement pinned yet.
      #
      # NOT in the --ignore list below, deliberately: GHSA-2f9f-gq7v-9h6m
      # (Apache Thrift, via `thrift` 0.17.0 <- `ailake-catalog`/
      # `ailake-parquet` 0.1.12's own internal `parquet` 52.2.0 pin — see
      # ROADMAP.md "Débitos conhecidos" for the full trace). No RUSTSEC-ID
      # exists for it (only shows up as a GitHub Dependabot alert), so
      # there's nothing to pass here — it's tracked/dismissed on the
      # Dependabot dashboard instead, same reasoning as everything above.
      - name: Audit root workspace
        run: cargo audit --no-yanked --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2025-0009 --ignore RUSTSEC-2024-0336 --ignore RUSTSEC-2026-0258 --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2026-0098 --ignore RUSTSEC-2026-0049 --ignore RUSTSEC-2026-0104 --ignore RUSTSEC-2025-0134 --ignore RUSTSEC-2025-0010 --ignore RUSTSEC-2023-0086 --ignore RUSTSEC-2026-0002 --ignore RUSTSEC-2026-0253 --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2024-0384 --ignore RUSTSEC-2025-0119 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0173
      - name: Audit crates/nexus-connectors workspace
        run: cargo audit --no-yanked --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2025-0009 --ignore RUSTSEC-2024-0336 --ignore RUSTSEC-2026-0258 --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2026-0098 --ignore RUSTSEC-2026-0049 --ignore RUSTSEC-2026-0104 --ignore RUSTSEC-2025-0134 --ignore RUSTSEC-2025-0010 --ignore RUSTSEC-2023-0086 --ignore RUSTSEC-2026-0002 --ignore RUSTSEC-2026-0253 --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2024-0384 --ignore RUSTSEC-2025-0119 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0173
        working-directory: crates/nexus-connectors

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Scans the full commit history (every ref, `--log-opts="--all"`) for
  # accidentally-committed secrets — added ahead of making this repo
  # public, when a stranger's PR/fork can see the entire history for the
  # first time. Ran manually once against all 383 commits/all refs
  # (2026-09-05): exactly one match, the documented non-secret test key in
  # crates/nexus-server/src/license.rs (see .gitleaks.toml's allowlist) —
  # no real leak found. This job guards against a *future* commit
  # introducing one, not a one-time audit.
  #
  # Pinned by version + sha256 (same pattern as this workflow's
  # appimagetool download / build-windows-installer.yml's gh CLI download)
  # rather than a marketplace action — gitleaks ships no pinned-SHA GitHub
  # Action of its own worth trusting blindly here.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history — a shallow clone can't scan past commits
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
          GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Scan full history for secrets
        run: ./gitleaks detect --source . --log-opts="--all" -c .gitleaks.toml --redact --exit-code 1

  # --all-features covers embed-ui, nexus-ai's `cpu` feature (ort/hf-hub/
  # tokenizers) and connectors-all (mongodb/kafka/milvus/lancedb/... all
  # linked into nexus-server, not just the nested crates/nexus-connectors
  # workspace) — this exact combination has previously blown a GitHub-hosted
  # runner's disk cap mid-link ("ld terminated with signal 7 [Bus error]",
  # 39MB free) back when this workflow ran self-hosted-only; moved to
  # `ubuntu-latest` 2026-09-05 at the user's explicit request (repo went
  # public same day) with a disk-reclaim step below as the mitigation —
  # not yet proven against a real run as of this commit.
  #
  # -p nexus-core -p nexus-ai -p nexus-server, not --workspace: `cargo
  # metadata --no-deps` from the repo root shows every crate under
  # crates/nexus-connectors as a package here too (a path dependency
  # without an explicit `package.workspace` doesn't stay scoped to its own
  # nested workspace once something in *this* workspace depends on it) —
  # `--workspace` would silently also lint/build every connector crate a
  # second time, redundant with the `connectors` job below which already
  # owns that.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Reclaim disk on the hosted runner before a --all-features build —
      # ubuntu-latest ships ~14GB free by default, already documented as
      # not enough for this exact feature combination (see job comment
      # above). Removing preinstalled toolchains this repo never uses
      # (.NET, Android SDK, GHC) is the standard mitigation for that
      # class of failure; verify against a real run, adjust if still short.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      # rdkafka (kafka feature) needs cmake + zlib headers; odbc-api
      # (odbc feature) needs unixODBC; lancedb's build.rs shells out to
      # protoc; nexus-connector-iceberg's iceberg-catalog-sql pulls in
      # sqlx's "sqlite" feature, which links the system libsqlite3.
      # None of these ship on ubuntu-latest by default — they were
      # "already present" only on the old self-hosted box, outside this
      # repo's version control until now.
      - name: Install system packages for connectors-all
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config protobuf-compiler libprotobuf-dev \
            zlib1g-dev libcurl4-openssl-dev unixodbc-dev libsqlite3-dev libpq-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
      # --all-features turns on nexus-server's embed-ui, whose
      # #[derive(RustEmbed)] needs frontend/dist to exist at compile time
      # (Marco 11). Built here directly rather than downloaded from the
      # `frontend` job's artifact (that upload is `continue-on-error` and
      # nothing downstream ever consumed it) — rebuilding is cheap and
      # frontend has no test-affecting logic clippy needs from a shared
      # build.
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: cargo clippy -p nexus-core -p nexus-ai -p nexus-server --all-targets --all-features -- -D warnings

  # Marco 11's done criterion, checked for real rather than just documented:
  # "docker run sobe binário único servindo UI em localhost:8080, sem
  # dependência externa além do container." Builds its own image from
  # scratch (frontend -> ADBC drivers -> release binary w/ embed-ui ->
  # runtime, see ../../Dockerfile) inside the Docker build context, so it
  # doesn't need the connectors-all system packages the clippy/test/
  # connectors jobs install directly on the runner — everything it needs
  # lives inside the Dockerfile's own build stages.
  docker-image:
    name: docker-image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      - uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          load: true
          tags: nexusflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the image and hit the embedded UI
        run: |
          jwt_secret="$(openssl rand -hex 32)"
          encryption_key="$(openssl rand -hex 32)"
          docker rm -f nexusflow-ci >/dev/null 2>&1 || true
          # Always clean up, even if healthcheck/assertions fail.
          cleanup() { docker rm -f nexusflow-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name nexusflow-ci -p 8080:8080 \
            -e NEXUS_JWT_SECRET="$jwt_secret" \
            -e NEXUS_ENCRYPTION_KEY="$encryption_key" \
            -e NEXUS_CHECKPOINT_DB=sqlite::memory: \
            -e NEXUS_AUTH_DB=sqlite::memory: \
            -e NEXUS_PIPELINES_DB=sqlite::memory: \
            nexusflow:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:8080/health && break
            sleep 1
          done
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
          health=$(curl -sf http://localhost:8080/health)
          docker logs nexusflow-ci
          [ "$status" = "200" ] || { echo "GET / returned $status, expected 200"; exit 1; }
          [ "$health" = "ok" ] || { echo "GET /health returned '$health', expected ok"; exit 1; }

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
      # --audit-level=high: low/moderate advisories in this ecosystem are
      # overwhelmingly transitive dev-tooling noise (see npm's own advisory
      # backlog) that would make this step fail on things nobody can act on
      # without an upstream release; high/critical is the bar worth
      # blocking a merge over.
      - run: npm audit --audit-level=high
      # continue-on-error: this artifact is a debug convenience only (1-day
      # retention, nothing downstream reads it) — it must never be the
      # reason this job reports red. Hit in practice: the org's Actions
      # artifact storage quota filled up ("Artifact storage quota has been
      # hit... recalculated every 6-12 hours"), which failed this step on
      # an otherwise fully green build/test/lint/audit run.
      - uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a # v4.3.6
        continue-on-error: true
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # Same disk/package story as clippy above — this job compiles
  # nexus-core/nexus-ai/nexus-server with --all-features (connectors-all
  # included) plus builds the real ADBC drivers from source.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      # cmake/pkg-config/libpq-dev/libsqlite3-dev/libfmt-dev are needed to
      # build the real ADBC drivers below (scripts/build-adbc-*-driver.sh,
      # C++ builds, not crates.io packages) plus the same connectors-all
      # system deps the clippy job installs (see that job's comment).
      - name: Install system packages for connectors-all + ADBC build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config protobuf-compiler libprotobuf-dev libfmt-dev \
            zlib1g-dev libcurl4-openssl-dev unixodbc-dev libsqlite3-dev libpq-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8

      # nexus-connector-postgres/nexus-connector-sqlite need the real ADBC
      # drivers at test runtime. Integration tests also need a live
      # Postgres via testcontainers (ubuntu-latest ships Docker).
      - name: Cache built ADBC drivers
        id: adbc-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: target/adbc
          key: adbc-drivers-apache-arrow-adbc-24-${{ runner.os }}-${{ hashFiles('scripts/build-adbc-postgresql-driver.sh', 'scripts/build-adbc-sqlite-driver.sh') }}

      - name: Build ADBC drivers
        if: steps.adbc-cache.outputs.cache-hit != 'true'
        run: |
          ./scripts/build-adbc-postgresql-driver.sh
          ./scripts/build-adbc-sqlite-driver.sh

      # --all-features turns on nexus-ai's `cpu` feature, whose
      # embedding_integration test (crates/nexus-ai/tests/embedding_integration.rs)
      # downloads a real sentence-transformers ONNX model + tokenizer from the
      # Hugging Face Hub into ~/.cache/nexusflow/models (see
      # nexus-ai::embedding::model::cache_root) — cached explicitly since a
      # hosted runner's cache doesn't otherwise survive between runs.
      - name: Cache Hugging Face model cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/nexusflow/models
          key: hf-models-${{ hashFiles('crates/nexus-ai/tests/embedding_integration.rs') }}

      # Same reason as the clippy job above: --all-features enables
      # embed-ui, whose RustEmbed derive needs frontend/dist to exist at
      # compile time — built here directly rather than downloaded from the
      # frontend job's (continue-on-error, allowed-to-fail) artifact upload.
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      # python_transform's own tests (`crates/nexus-server/src/
      # python_transform.rs`) shell out to a real `python3` and need
      # pandas/numpy/pyarrow/polars/python-dateutil on top of it — the
      # same packages the Dockerfile installs into the shipped image
      # (CLAUDE.md §4.3). ubuntu-latest ships a bare python3; installed
      # directly here (hosted runner, no shared-desktop venv to reuse).
      - name: Install Python packages for python_transform tests
        run: pip install --no-input pandas numpy pyarrow polars python-dateutil

      - name: Run tests
        env:
          ADBC_DRIVER_POSTGRESQL_PATH: ${{ github.workspace }}/target/adbc/libadbc_driver_postgresql.so
          ADBC_DRIVER_SQLITE_PATH: ${{ github.workspace }}/target/adbc/libadbc_driver_sqlite.so
        # -p nexus-core -p nexus-ai -p nexus-server, not --workspace: same
        # reason as the clippy job's comment above. Concretely, this is
        # what caused PR #6/#7's post-merge `test` run to fail here — with
        # --workspace, this step was *also* running every connector crate's
        # own heavy/flaky container-based integration tests (e.g. kafka's
        # postgres_to_kafka_cdc_carries_correct_opcode_per_row, a 3-JVM
        # Debezium test) a second time, racing the `connectors` job below
        # for the same runner's Docker/CPU and timing out.
        run: cargo test -p nexus-core -p nexus-ai -p nexus-server --all-features

  # crates/nexus-connectors is its own Cargo workspace (crate-per-connector,
  # see CLAUDE.md §3/§8.5) — the jobs above don't touch this directory, but
  # every connector crate in it IS now also pulled into the root workspace
  # graph via nexus-server's per-connector features (clippy/test above cover
  # them there too, under connectors-all). This job separately checks that
  # every connector crate still compiles/lints/tests standalone within its
  # own nested workspace (its own `cargo check --workspace` with no
  # features), independent of whatever subset nexus-server happens to link.
  #
  # `crates/nexus-connectors/Cargo.lock` is tracked on purpose so the drift
  # check below compares two reproducible lockfiles instead of a fresh
  # resolution (which would drift whenever crates.io publishes new compatible
  # patch releases). The root Cargo.lock remains authoritative for release
  # builds of the nexusflow binary; the connectors lock is only for this
  # nested workspace's own CI checks. `cargo check --workspace --locked`
  # below validates that the committed lock is still usable, and the drift
  # step right after it guarantees the two locks stay aligned.
  #
  # Heaviest job in this workflow (lancedb/milvus/mongodb dep trees) —
  # previously the one that actually hit the 14GB disk cap on
  # `ubuntu-latest` (see the workflow-level comment's history). Same
  # disk-reclaim + system-package mitigation as clippy/test above; this
  # job is the real test of whether that's enough.
  connectors:
    name: connectors
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: crates/nexus-connectors
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      # zlib headers (kafka consumer feature) + protoc (lancedb's build.rs
      # shells out to it) + libsqlite3-dev (nexus-connector-iceberg's
      # iceberg-catalog-sql -> sqlx "sqlite" feature links the system lib).
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config protobuf-compiler libprotobuf-dev \
            zlib1g-dev libcurl4-openssl-dev unixodbc-dev libsqlite3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          workspaces: crates/nexus-connectors

      - run: cargo fmt --all -- --check

      # Every connector must also compile with no features enabled — that's
      # the whole point of gating rdkafka/odbc-api behind Cargo features
      # (CLAUDE.md §8.5), so it's checked on its own before --all-features.
      # --locked ensures we exercise the exact dependency graph tracked in
      # crates/nexus-connectors/Cargo.lock, the same one the drift check below
      # compares against the root lock.
      - run: cargo check --workspace --locked

      # Compare the nested workspace's tracked Cargo.lock against the root
      # one — same connector crates' dependencies, resolved independently
      # (see this job's top comment), which can silently drift apart over
      # time if not kept in sync.
      - run: python3 ../../scripts/check-lockfile-drift.py

      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # postgres_to_kafka_cdc_carries_correct_opcode_per_row (3 JVMs:
      # Zookeeper+Kafka+Connect) and text_chunk_embed_milvus_end_to_end
      # (3 containers: etcd+minio+milvus) are the two heaviest, flakiest
      # tests in this workspace — skipped here for the same reason they
      # always were (resource pressure), not re-evaluated as part of this
      # runner migration.
      - run: cargo test --workspace --all-features --locked -- --skip postgres_to_kafka_cdc_carries_correct_opcode_per_row --skip text_chunk_embed_milvus_end_to_end
