name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # nexus-connector-postgres needs the real ADBC PostgreSQL driver at test
      # runtime (it's a C++/libpq implementation, not a crates.io package —
      # see scripts/build-adbc-postgresql-driver.sh). Integration tests also
      # need a live Postgres via testcontainers, which GitHub-hosted runners
      # can do out of the box (Docker daemon is preinstalled).
      - name: Install native build deps for the ADBC PostgreSQL driver
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libpq-dev libfmt-dev

      - name: Cache built ADBC driver
        id: adbc-cache
        uses: actions/cache@v4
        with:
          path: target/adbc
          key: adbc-postgresql-driver-${{ runner.os }}-${{ hashFiles('scripts/build-adbc-postgresql-driver.sh') }}

      - name: Build ADBC PostgreSQL driver
        if: steps.adbc-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-adbc-postgresql-driver.sh

      - name: Run tests
        env:
          ADBC_DRIVER_POSTGRESQL_PATH: ${{ github.workspace }}/target/adbc/libadbc_driver_postgresql.so
        run: cargo test --workspace --all-features
