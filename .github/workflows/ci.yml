name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Self-hosted, not ubuntu-latest: --all-features now covers embed-ui,
  # nexus-ai's `cpu` feature (ort/hf-hub/tokenizers) and connectors-all
  # (mongodb/kafka/milvus/lancedb/... all linked into nexus-server, not
  # just the nested crates/nexus-connectors workspace) — this combination
  # already ran ubuntu-latest out of its ~14GB disk cap mid-link ("ld
  # terminated with signal 7 [Bus error]", 39MB free). Same root cause the
  # `connectors` job below already solved by moving to self-hosted
  # (052e26c); root-workspace jobs now share that same rationale.
  #
  # -p nexus-core -p nexus-ai -p nexus-server, not --workspace: `cargo
  # metadata --no-deps` from the repo root shows every crate under
  # crates/nexus-connectors as a package here too (a path dependency
  # without an explicit `package.workspace` doesn't stay scoped to its own
  # nested workspace once something in *this* workspace depends on it) —
  # `--workspace` would silently also lint/build every connector crate a
  # second time, redundant with the `connectors` job below which already
  # owns that.
  clippy:
    name: clippy
    needs: fmt
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --all-features turns on nexus-server's embed-ui, whose
      # #[derive(RustEmbed)] needs frontend/dist to exist at compile time
      # (Marco 11) — build it for real rather than faking an empty dir, so
      # this also catches an actually-broken frontend build.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: cargo clippy -p nexus-core -p nexus-ai -p nexus-server --all-targets --all-features -- -D warnings

  # Marco 11's done criterion, checked for real rather than just documented:
  # "docker run sobe binário único servindo UI em localhost:8080, sem
  # dependência externa além do container." Independent job (no `needs:`) —
  # builds its own image from scratch (frontend -> ADBC drivers -> release
  # binary w/ embed-ui -> runtime, see ../../Dockerfile), so it doesn't
  # share any state with the fmt/clippy/test chain above.
  docker-image:
    name: docker-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nexusflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the image and hit the embedded UI
        run: |
          docker run -d --name nexusflow-ci -p 8080:8080 \
            -e NEXUS_JWT_SECRET=ci-secret-that-is-long-enough-for-jwt-signing \
            -e NEXUS_ENCRYPTION_KEY=$(printf 'ab%.0s' {1..32}) \
            -e NEXUS_CHECKPOINT_DB=sqlite::memory: \
            -e NEXUS_AUTH_DB=sqlite::memory: \
            -e NEXUS_PIPELINES_DB=sqlite::memory: \
            nexusflow:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:8080/health && break
            sleep 1
          done
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
          health=$(curl -sf http://localhost:8080/health)
          docker logs nexusflow-ci
          docker rm -f nexusflow-ci
          [ "$status" = "200" ] || { echo "GET / returned $status, expected 200"; exit 1; }
          [ "$health" = "ok" ] || { echo "GET /health returned '$health', expected ok"; exit 1; }

  # frontend/ (Marco 8) doesn't touch the Rust workspace or the self-hosted
  # runner — no `needs:`, runs independently on GitHub-hosted infra instead
  # of joining the fmt -> clippy -> test -> connectors chain (that chain is
  # sequential specifically to avoid overloading the self-hosted machine,
  # see 052e26c; this job never runs there).
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  # Self-hosted for the same reason as clippy above.
  test:
    name: test
    needs: clippy
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # nexus-connector-postgres/nexus-connector-sqlite need the real ADBC
      # drivers at test runtime (C++ implementations, not crates.io packages —
      # see scripts/build-adbc-*-driver.sh). Integration tests also need a
      # live Postgres via testcontainers (self-hosted has Docker, same as
      # the connectors job below relies on). cmake/pkg-config/libpq-dev/
      # libsqlite3-dev/libfmt-dev are assumed already present on this host,
      # same posture as the connectors job's own comment below — no sudo
      # apt-get here (runner service has no interactive sudo).
      - name: Cache built ADBC drivers
        id: adbc-cache
        uses: actions/cache@v4
        with:
          path: target/adbc
          key: adbc-drivers-${{ runner.os }}-${{ hashFiles('scripts/build-adbc-postgresql-driver.sh', 'scripts/build-adbc-sqlite-driver.sh') }}

      - name: Build ADBC drivers
        if: steps.adbc-cache.outputs.cache-hit != 'true'
        run: |
          ./scripts/build-adbc-postgresql-driver.sh
          ./scripts/build-adbc-sqlite-driver.sh

      # Same reason as the clippy job: --all-features enables embed-ui,
      # whose RustEmbed derive needs frontend/dist to exist at compile time.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend

      - name: Run tests
        env:
          ADBC_DRIVER_POSTGRESQL_PATH: ${{ github.workspace }}/target/adbc/libadbc_driver_postgresql.so
          ADBC_DRIVER_SQLITE_PATH: ${{ github.workspace }}/target/adbc/libadbc_driver_sqlite.so
        # -p nexus-core -p nexus-ai -p nexus-server, not --workspace: same
        # reason as the clippy job's comment above. Concretely, this is
        # what caused PR #6/#7's post-merge `test` run to fail here — with
        # --workspace, this step was *also* running every connector crate's
        # own heavy/flaky container-based integration tests (e.g. kafka's
        # postgres_to_kafka_cdc_carries_correct_opcode_per_row, a 3-JVM
        # Debezium test) a second time, racing the `connectors`/
        # `connectors-heavy` jobs below for the same self-hosted machine's
        # Docker/CPU and timing out.
        run: cargo test -p nexus-core -p nexus-ai -p nexus-server --all-features

  # crates/nexus-connectors is its own Cargo workspace (crate-per-connector,
  # see CLAUDE.md §3/§8.5) — the jobs above don't touch this directory, but
  # every connector crate in it IS now also pulled into the root workspace
  # graph via nexus-server's per-connector features (clippy/test above cover
  # them there too, under connectors-all). This job separately checks that
  # every connector crate still compiles/lints/tests standalone within its
  # own nested workspace (its own `cargo check --workspace` with no
  # features), independent of whatever subset nexus-server happens to link.
  connectors:
    name: connectors
    needs: test
    # Self-hosted runner (nexusflow-local) — heaviest job (lancedb/milvus/
    # mongodb dep trees), was hitting the 14GB disk cap on ubuntu-latest.
    # Repo is private, single-maintainer, so no untrusted-PR risk.
    runs-on: self-hosted
    defaults:
      run:
        working-directory: crates/nexus-connectors
    # nexus-connector-lancedb/-milvus/-mongodb each pull in huge dependency
    # trees (Lance/DataFusion/arrow-flight, tonic+prost, the full mongodb
    # driver) — this is what blew past the GitHub-hosted runner's 14GB disk
    # (see git history for that saga). Moot on self-hosted: real disk, no
    # preinstalled-toolchain cleanup or job-count throttling needed.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/nexus-connectors

      # zlib headers (kafka consumer feature) + protoc (lancedb's build.rs
      # shells out to it) + libsqlite3-dev (nexus-connector-iceberg's
      # iceberg-catalog-sql -> sqlx "sqlite" feature links the system lib)
      # are installed once on the self-hosted host, not per-run — no sudo
      # apt-get here (runner service has no interactive sudo, and the
      # packages persist on this disk between jobs anyway).
      - run: cargo fmt --all -- --check

      # Every connector must also compile with no features enabled — that's
      # the whole point of gating rdkafka/odbc-api behind Cargo features
      # (CLAUDE.md §8.5), so it's checked on its own before --all-features.
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # postgres_to_kafka_cdc_carries_correct_opcode_per_row (3 JVMs:
      # Zookeeper+Kafka+Connect) and text_chunk_embed_milvus_end_to_end
      # (3 containers: etcd+minio+milvus) are the two heaviest, flakiest
      # tests in this workspace — this host is a shared dev desktop +
      # self-hosted runner, chronically near its memory ceiling from normal
      # desktop use, and these are the tests that feel it first. Deferred to
      # the connectors-heavy job below so they run only after this job's own
      # compile step has fully exited (and released its memory) instead of
      # competing with it.
      - run: cargo test --workspace --all-features -- --skip postgres_to_kafka_cdc_carries_correct_opcode_per_row --skip text_chunk_embed_milvus_end_to_end

  # Split out from `connectors` so the two heaviest/flakiest multi-container
  # tests run after that job's huge compile step has fully exited — see the
  # comment on connectors' last step. Runs on a dedicated Windows self-hosted
  # runner (label `windows-connectors-heavy`) so it does not contend for RAM
  # with the Linux self-hosted runner that runs clippy/test/connectors.
  # `needs: connectors` is kept so the heavy tests only start after the
  # connectors workspace has passed its own compile/test gate.
  connectors-heavy:
    name: connectors-heavy
    needs: connectors
    runs-on: [self-hosted, windows-connectors-heavy]
    defaults:
      run:
        shell: bash
        working-directory: crates/nexus-connectors
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/nexus-connectors

      - run: cargo test -p nexus-connector-kafka --all-features --test cdc_debezium_integration
      - run: cargo test -p nexus-connector-milvus --all-features --test milvus_integration
