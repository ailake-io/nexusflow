name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # nexus-connector-postgres/nexus-connector-sqlite need the real ADBC
      # drivers at test runtime (C++ implementations, not crates.io packages —
      # see scripts/build-adbc-*-driver.sh). Integration tests also need a
      # live Postgres via testcontainers, which GitHub-hosted runners can do
      # out of the box (Docker daemon is preinstalled).
      - name: Install native build deps for the ADBC drivers
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libpq-dev libsqlite3-dev libfmt-dev

      - name: Cache built ADBC drivers
        id: adbc-cache
        uses: actions/cache@v4
        with:
          path: target/adbc
          key: adbc-drivers-${{ runner.os }}-${{ hashFiles('scripts/build-adbc-postgresql-driver.sh', 'scripts/build-adbc-sqlite-driver.sh') }}

      - name: Build ADBC drivers
        if: steps.adbc-cache.outputs.cache-hit != 'true'
        run: |
          ./scripts/build-adbc-postgresql-driver.sh
          ./scripts/build-adbc-sqlite-driver.sh

      - name: Run tests
        env:
          ADBC_DRIVER_POSTGRESQL_PATH: ${{ github.workspace }}/target/adbc/libadbc_driver_postgresql.so
          ADBC_DRIVER_SQLITE_PATH: ${{ github.workspace }}/target/adbc/libadbc_driver_sqlite.so
        run: cargo test --workspace --all-features

  # crates/nexus-connectors is its own Cargo workspace (crate-per-connector,
  # see CLAUDE.md §3/§8.5) — none of the jobs above touch it, since only
  # connectors nexus-server actually imports (postgres/sqlite) get pulled
  # into the root workspace graph. This job is the only place rest/mongodb/
  # kafka/odbc get built, linted and tested at all.
  connectors:
    name: connectors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/nexus-connectors
    # nexus-connector-lancedb/-milvus/-mongodb each pull in huge dependency
    # trees (Lance/DataFusion/arrow-flight, tonic+prost, the full mongodb
    # driver). The earlier "SIGBUS while linking" failures (CI runs
    # 30599631960, 30620035322) turned out to be the standard GitHub-hosted
    # runner's 14GB disk filling up mid-write on a huge .rlib (confirmed by
    # run 30622086743: same build, explicit "No space left on device" once
    # the swap file — itself eating disk — was removed from the equation).
    # Not a RAM or linker-choice problem after all. Fixed by reclaiming
    # ~30-50GB from unused preinstalled toolchains and shrinking debug info
    # in Cargo.toml (see [profile.dev] there) so target/ itself is smaller.
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/nexus-connectors

      - name: Free disk space (preinstalled toolchains this job never uses)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY"
          df -h /

      # nexus-connector-kafka's `consumer` feature builds librdkafka from
      # vendored source (needs zlib headers); nexus-connector-odbc's
      # `legacy` feature vendors unixODBC the same way but only needs a C
      # compiler, already on the runner — see IMPLEMENTATION_PLAN.md Marco 3.
      # protobuf-compiler (protoc): nexus-connector-lancedb pulls in
      # lance-encoding, whose build.rs shells out to protoc to compile its
      # .proto files — no vendored/pure-Rust fallback.
      - name: Install native build deps for the kafka consumer feature and lancedb's protoc build dep
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev protobuf-compiler

      - run: cargo fmt --all -- --check

      # Every connector must also compile with no features enabled — that's
      # the whole point of gating rdkafka/odbc-api behind Cargo features
      # (CLAUDE.md §8.5), so it's checked on its own before --all-features.
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
