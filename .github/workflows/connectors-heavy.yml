name: connectors-heavy

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'crates/nexus-connectors/**'
      - '.github/workflows/connectors-heavy.yml'
  # On main, this is step 2 of a deliberate 3-stage chain: CI -> connectors-heavy
  # -> Release (see release.yml's matching workflow_run trigger for step 3).
  # `workflow_run` is the only way to sequence separate workflow files —
  # there's no cross-file `needs:`. The job-level `if:` below only lets this
  # actually run when CI's main-branch run succeeded; a failed/cancelled CI
  # run on main should not still kick off this heavy suite.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  connectors-heavy:
    name: connectors-heavy
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # Moved off a dedicated self-hosted Windows box to hosted `ubuntu-latest`
    # 2026-09-05 (repo went public same day, no more self-hosted NexusFlow
    # Actions — see ci.yml/release.yml for the same migration). Originally
    # ran on Windows only because that was the available "heavy" dedicated
    # machine, not because the test needs Windows — `milvus_integration.rs`
    # is plain testcontainers + Docker + CPU embeddings, nothing
    # OS-specific, confirmed by reading the test itself. `windows-latest`
    # was tried first and failed outright: GitHub's hosted Windows image
    # doesn't run Docker in Linux-container mode, so testcontainers had no
    # daemon to reach at all ("failed to connect to the docker API...
    # system cannot find the file specified"). Linux hosted runners already
    # run Docker natively — same pattern ci.yml's test/connectors jobs use.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: crates/nexus-connectors
    steps:
      # workflow_run's default ref/sha context is the repo's default branch,
      # not the commit CI just validated on main — pin explicitly so this
      # actually tests the same commit, not an unrelated one.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      # protobuf-compiler alone doesn't ship the google/protobuf/*.proto
      # well-known-types files on Ubuntu (needed by milvus-sdk-rust's
      # build.rs via prost-build) — libprotobuf-dev provides those. Same
      # fix ci.yml's clippy/test/connectors jobs needed for the same reason.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          workspaces: crates/nexus-connectors

      # --all-features turns on nexus-ai's `cpu` feature, whose embedding
      # model download needs the Hugging Face Hub cache — same as ci.yml's
      # test job, cached the same way for the same reason (hosted runner
      # cache doesn't otherwise survive between runs).
      - name: Cache Hugging Face model cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/nexusflow/models
          key: hf-models-milvus-${{ hashFiles('crates/nexus-connectors/nexus-connector-milvus/tests/milvus_integration.rs') }}

      - run: cargo test -p nexus-connector-milvus --all-features --test milvus_integration
