name: Docker Hub Publish

# Publishes the enterprise-bundled Docker image to Docker Hub
# (thiagolange/nexusflow) — split out of release.yml on 2026-09-08 (that
# workflow used to publish the same image to GHCR instead; the image's
# home is Docker Hub now). Kept as its own workflow file, not a job inside
# release.yml, so it doesn't compete for release.yml's runner slot and can
# be re-run on its own without re-running the whole build/package chain.
#
# Deliberately does NOT duplicate release.yml's `determine-version` job
# (Cargo.toml version bump + push to main on a manual dispatch) — that
# logic living in two places at once would race if both ran close
# together. This workflow never mutates Cargo.toml or pushes a commit.
#
# The version and the commit to build both come from the GitHub Release's
# *tag* — never from the commit that triggered this run. On a manual
# Release dispatch with a new version, `determine-version` pushes a bump
# commit AFTER the run started, so `workflow_run.head_sha` (and `main` at
# trigger time) still says the previous version: real bug 2026-09-19, the
# automatic run after the v0.1.7 release re-built and re-pushed the
# already-published `v0.1.6` tag from the new code. Resolving via the tag
# makes the image always match the release it is named after, and makes a
# manual dispatch for an old version rebuild *that* version's commit.
#
# Requires two repo secrets that don't exist yet as of this writing:
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token, not
# the account password — create one at hub.docker.com/settings/security).
# Add both under Settings > Secrets and variables > Actions before this
# workflow can push anything; until then every run fails at the login
# step.

on:
  # Runs after Release finishes on main — same commit Release just
  # tagged, so the image and that GitHub Release always match. `workflow_run`
  # is the only way to sequence separate workflow files; there's no
  # cross-file `needs:`.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]
  # Manual escape hatch, e.g. to re-push an image for a version already
  # released (a failed push, a Docker Hub outage during the automatic run,
  # etc.) without re-running the entire Release chain. `version` must
  # already exist as a GitHub Release — this workflow does not create one.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.4 or v0.1.4) — must already be a published GitHub Release; the image is built from that release's tag commit"
        required: true
        type: string

permissions:
  contents: read

jobs:
  docker-publish:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Determine version and commit sha (from the release tag)
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          latest_tag="$(gh api "repos/$repo/releases/latest" --jq .tag_name)"
          if [ -n "${DISPATCH_VERSION:-}" ]; then
            # Accept both "0.1.7" and "v0.1.7" — the two forms are easy to
            # mix up across this repo's workflows (release.yml/this one take
            # no "v"; the installer workflows do) and each mix-up used to be
            # a failed run.
            version="${DISPATCH_VERSION#v}"
          else
            version="${latest_tag#v}"
          fi
          tag="v$version"
          if ! sha="$(gh api "repos/$repo/commits/$tag" --jq .sha 2>/dev/null)" || [ -z "$sha" ]; then
            echo "::error::No release tag $tag found — this workflow only publishes versions that already exist as a GitHub Release."
            exit 1
          fi
          # `latest` must only move when this really is the newest release,
          # so re-publishing an old version can never make it the default.
          if [ "$tag" = "$latest_tag" ]; then is_latest=true; else is_latest=false; fi
          echo "Publishing $tag @ $sha (latest tag moves: $is_latest)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "is_latest=$is_latest" >> "$GITHUB_OUTPUT"

      # Same reasoning as release.yml's equivalent step (now removed from
      # there): every distributed artifact ships every enterprise
      # connector, license-gated, so the Store always has something to
      # sell no matter which install path someone picked — this image is
      # one of those paths. `enterprise-src`'s own Dockerfile clones its
      # own pinned `nexusflow` checkout internally (at NEXUSFLOW_REV), so this
      # job never needs a checkout of *this* repo.
      - name: Clone nexus-connectors-enterprise (read-only deploy key)
        env:
          DEPLOY_KEY: ${{ secrets.ENTERPRISE_REPO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p -m 0700 ~/.ssh
          # See release.yml's identical step for why the CRLF-strip +
          # exactly-one-trailing-newline dance below is needed (real
          # failure hit on a first run: "error in libcrypto").
          key="$(printf '%s' "$DEPLOY_KEY" | tr -d '\r')"
          printf '%s\n' "$key" > ~/.ssh/enterprise_deploy_key
          chmod 600 ~/.ssh/enterprise_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/enterprise_deploy_key -o IdentitiesOnly=yes" \
            git clone --depth 1 ssh://git@github.com/ailake-io/nexus-connectors-enterprise.git \
            enterprise-src
          rm -f ~/.ssh/enterprise_deploy_key

      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: thiagolange/nexusflow
          tags: |
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_latest == 'true' }}

      - name: Build and push Docker image (full)
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
        with:
          context: enterprise-src
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXUSFLOW_REV=${{ steps.version.outputs.sha }}
            ENTERPRISE_FEATURES=connectors-all
