name: build-macos-installer

# macOS tarball build. Runs after a successful Release on `main`, and can
# also be dispatched manually when an installer is needed. Proven against
# a real run since 2026-09-06; since Fase 35 (2026-10-28) every connector
# lives in this repo's own connectors-all, so this is the same plain
# build release.yml's own macOS leg already does — kept as its own
# workflow for re-run/dispatch independence from the main Release chain.
#
# Homebrew formula (packaging/macos/nexusflow.rb) expects exactly the
# artifact this produces: nexusflow-macos-arm64.tar.gz attached to a
# GitHub Release, containing nexusflow-bin + the 4 ADBC .dylib's.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Existing release tag (e.g. v0.1.3, already published by
          release.yml) to attach the built tarball to via `gh release
          upload`. Leave blank to just build and upload it as a workflow
          artifact, without publishing it anywhere.
        required: false
        type: string
  # A Release originating from main triggers this installer after all
  # release jobs have completed. Develop pushes/releases do not trigger it.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos-installer:
    name: build-macos-installer
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: macos-latest
    # Matches build-windows-installer.yml's timeout — left at 240 for
    # headroom even though Fase 35 (2026-10-28) dropped the second,
    # separate enterprise build this used to also do back-to-back.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # Manual dispatch with an empty version only uploads an artifact. A
      # supplied tag attaches the tarball to that release. The automatic
      # path derives the version from the commit Release just published.
      - name: Resolve version
        id: resolve-version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.version }}"
          else
            version="$(grep -A3 '^\[workspace.package\]' Cargo.toml | grep '^version' | head -1 | cut -d '"' -f2)"
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8

      # Same fix release.yml's macOS leg already validated on a real run
      # (2026-09-06): libpq is keg-only in Homebrew, needs PKG_CONFIG_PATH
      # exported explicitly or pkg_check_modules(libpq) fails outright.
      - name: Install native build deps (macOS)
        run: |
          brew install unixodbc libpq fmt protobuf
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - run: ./scripts/build-adbc-postgresql-driver.sh target/adbc
      - run: ./scripts/build-adbc-sqlite-driver.sh target/adbc
      - run: ./scripts/build-adbc-duckdb-driver.sh target/adbc
      - run: ./scripts/build-adbc-clickhouse-driver.sh target/adbc

      - name: cargo build --release
        run: cargo build --release -p nexusflow --features embed-ui,connectors-all

      # Same shape as release.yml's "Package tarball" step.
      - name: Package tarball
        run: |
          stage="$(mktemp -d)"
          cp target/release/nexusflow "$stage/nexusflow-bin"
          cp target/adbc/libadbc_driver_postgresql.dylib "$stage/"
          cp target/adbc/libadbc_driver_sqlite.dylib "$stage/"
          cp target/adbc/libadbc_driver_duckdb.dylib "$stage/"
          cp target/adbc/libadbc_clickhouse.dylib "$stage/"
          tar -czf nexusflow-macos-arm64.tar.gz -C "$stage" .

      # Only needed when no `version` was given — same reasoning as
      # build-windows-installer.yml's matching step (Actions artifact
      # storage quota, don't depend on it when publishing straight from
      # disk is an option).
      - uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a # v4.4.3
        if: steps.resolve-version.outputs.tag == ''
        with:
          name: nexusflow-macos-installer
          path: nexusflow-macos-arm64.tar.gz

      # GitHub-hosted macos-latest ships the `gh` CLI preinstalled —
      # unlike build-windows-installer.yml's self-hosted-turned-hosted
      # Windows box, no separate install step needed here.
      - name: Attach to release
        if: steps.resolve-version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve-version.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" nexusflow-macos-arm64.tar.gz --clobber
